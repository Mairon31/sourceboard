name: Canonical profile test formatting

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery
    paths:
      - .github/workflows/prettier-profile-fix.yml

permissions:
  contents: write

jobs:
  format-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/profile-comments-categories-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Apply repository Prettier configuration
        run: npx prettier --write tests/e2e/profile-editor.spec.ts
      - name: Verify and commit canonical formatting
        run: |
          npx prettier --check tests/e2e/profile-editor.spec.ts
          git diff --check
          git config user.name "Mairon"
          git config user.email "maironjoelkin430@gmail.com"
          git rm -f .github/workflows/prettier-profile-fix.yml
          git add tests/e2e/profile-editor.spec.ts
          git commit -m "style(profile): apply canonical prettier output"
          git push origin HEAD:feature/profile-comments-categories-discovery
