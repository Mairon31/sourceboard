name: Phase F format cleanup

on:
  push:
    branches:
      - feature/community-cosmetics-profile-identity-emotes

permissions:
  contents: write

jobs:
  format-cleanup:
    if: "${{ github.event.head_commit.message != 'style(plan): format Phase C and E files' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/community-cosmetics-profile-identity-emotes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format only affected files
        run: npx prettier --write tests/unit/community-plan-phase-c.test.ts tests/unit/community-plan-phase-e1.test.ts tests/unit/community-plan-phase-e2.test.ts worker/admin/audit-visibility.ts worker/profile/username-policy.ts
      - name: Verify formatting and focused behavior
        run: |
          npx prettier --check tests/unit/community-plan-phase-c.test.ts tests/unit/community-plan-phase-e1.test.ts tests/unit/community-plan-phase-e2.test.ts worker/admin/audit-visibility.ts worker/profile/username-policy.ts
          npx eslint tests/unit/community-plan-phase-c.test.ts tests/unit/community-plan-phase-e1.test.ts tests/unit/community-plan-phase-e2.test.ts worker/admin/audit-visibility.ts worker/profile/username-policy.ts
          npm test -- tests/unit/community-plan-phase-c.test.ts tests/unit/community-plan-phase-e1.test.ts
          git diff --check
      - name: Commit verified formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/community-plan-phase-c.test.ts tests/unit/community-plan-phase-e1.test.ts tests/unit/community-plan-phase-e2.test.ts worker/admin/audit-visibility.ts worker/profile/username-policy.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(plan): format Phase C and E files"
          git push origin HEAD:feature/community-cosmetics-profile-identity-emotes
