name: Retry media picker implementation

on:
  push:
    paths:
      - .github/workflows/retry-media-picker.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Make the focused assertion semantic
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = '.github/workflows/implement-media-picker.yml';
          let s = fs.readFileSync(path, 'utf8');
          const before = `expect(picker).toContain('aria-label="Emotes"');`;
          const after = `expect(picker).toContain('"Emotes"');`;
          if (!s.includes(before)) throw new Error('expected assertion not found');
          fs.writeFileSync(path, s.replace(before, after));
          NODE
          rm .github/workflows/retry-media-picker.yml
      - name: Commit retry trigger
        run: |
          git config user.name "sourceboard-builder"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/implement-media-picker.yml .github/workflows/retry-media-picker.yml
          git commit -m "test: make media picker tab assertion semantic"
          git push origin master
