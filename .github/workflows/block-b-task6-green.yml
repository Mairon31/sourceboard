name: Block B Task 6 GREEN

on:
  push:
    branches:
      - feature/platform-overhaul-block-b

permissions:
  contents: write

jobs:
  task6-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Task 6 GREEN
        run: |
          python .github/scripts/block-b-task6-green.py
          rm .github/scripts/block-b-task6-green.py
          rm .github/workflows/block-b-task6-green.yml
      - name: Format changed files
        run: npx prettier --write worker/auth/store.ts worker/auth/service.ts worker/auth/api.ts app/routes/settings.tsx app/components/product/settings-redesign.css tests/e2e/settings-security.spec.ts
      - name: Focused Task 6 unit tests
        run: npm test -- --run tests/unit/settings-security-layout.test.ts tests/unit/session-presenter.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint and format check
        run: npm run lint
      - name: Commit Task 6 GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: redesign account security settings"
          git push origin HEAD:feature/platform-overhaul-block-b
