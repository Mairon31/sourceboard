name: Task 1 edit round-trip RED

on:
  push:
    branches:
      - feature/community-cosmetics-profile-identity-emotes

permissions:
  contents: write

jobs:
  edit-round-trip-red:
    if: "${{ github.event.head_commit.message != 'chore(task1): format edit RED tests' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/community-cosmetics-profile-identity-emotes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format RED tests
        run: npx prettier --write tests/unit/markdown-richtext.test.ts tests/unit/media-picker.test.ts
      - name: Persist canonical test formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/markdown-richtext.test.ts tests/unit/media-picker.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(task1): format edit RED tests"
            git push origin HEAD:feature/community-cosmetics-profile-identity-emotes
          fi
      - name: Run edit round-trip RED
        run: npm test -- tests/unit/markdown-richtext.test.ts tests/unit/media-picker.test.ts
