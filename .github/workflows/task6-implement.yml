name: Task 6 implement

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/profile-comments-categories-discovery
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Apply minimal CommentThread patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/components/product/CommentThread.tsx")
          source = path.read_text()

          import_anchor = "  FlagIcon,\n  HeartIcon,\n  MessageIcon,\n  MoreIcon,\n  Textarea,"
          import_replacement = "  FlagIcon,\n  GifIcon,\n  HeartIcon,\n  MessageIcon,\n  MoreIcon,\n  SmileIcon,\n  StickerIcon,\n  Textarea,"
          if import_anchor not in source:
              raise SystemExit("CommentThread icon import anchor not found")
          source = source.replace(import_anchor, import_replacement, 1)

          controls = [
              (
                  "GIF",
                  "GifIcon",
                  r'<button\s+type="button"\s+aria-expanded=\{mediaKind === "GIF"\}\s+onClick=\{\(\) => setMediaKind\(mediaKind === "GIF" \? null : "GIF"\)\}\s*>\s*GIF\s*</button>',
              ),
              (
                  "STICKER",
                  "StickerIcon",
                  r'<button\s+type="button"\s+aria-expanded=\{mediaKind === "STICKER"\}\s+onClick=\{\(\) => setMediaKind\(mediaKind === "STICKER" \? null : "STICKER"\)\}\s*>\s*Sticker\s*</button>',
              ),
              (
                  "EMOTE",
                  "SmileIcon",
                  r'<button\s+type="button"\s+aria-expanded=\{mediaKind === "EMOTE"\}\s+onClick=\{\(\) => setMediaKind\(mediaKind === "EMOTE" \? null : "EMOTE"\)\}\s*>\s*Emote\s*</button>',
              ),
          ]
          labels = {"GIF": "GIF", "STICKER": "Sticker", "EMOTE": "Emote"}
          for kind, icon, pattern in controls:
              label = labels[kind]
              active_expr = "$" + "{mediaKind === \"" + kind + "\" ? \" is-active\" : \"\"}"
              replacement = (
                  '<button\n'
                  '  className={`product-comment-composer__media-action' + active_expr + '`}\n'
                  '  type="button"\n'
                  '  aria-label="' + label + '"\n'
                  '  title="' + label + '"\n'
                  '  aria-expanded={mediaKind === "' + kind + '"}\n'
                  '  onClick={() => setMediaKind(mediaKind === "' + kind + '" ? null : "' + kind + '")}\n'
                  '>\n'
                  '  <' + icon + ' width="20" height="20" />\n'
                  '</button>'
              )
              source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit("CommentThread " + kind + " toolbar control not found")

          path.write_text(source)
          PY
      - run: npx prettier app/components/product/CommentThread.tsx app/components/ui/icons.tsx app/components/product/comment-actions.css tests/unit/media-picker.test.ts tests/unit/comments-social-actions.test.ts --write
      - run: npx vitest run tests/unit/media-picker.test.ts tests/unit/comments-social-actions.test.ts
      - run: npm run typecheck
      - run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/product/CommentThread.tsx app/components/ui/icons.tsx app/components/product/comment-actions.css tests/unit/media-picker.test.ts tests/unit/comments-social-actions.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(comments): polish composer and overflow controls"
          git push origin HEAD:feature/profile-comments-categories-discovery
