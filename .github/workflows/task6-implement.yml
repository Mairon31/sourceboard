name: Task 6 implement

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/profile-comments-categories-discovery
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Apply minimal CommentThread patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/components/product/CommentThread.tsx")
          source = path.read_text()

          old_imports = '''  EditIcon,
            FlagIcon,
            HeartIcon,
            MessageIcon,
            MoreIcon,
            Textarea,
            TrashIcon,'''.replace("            ", "  ")
          new_imports = '''  EditIcon,
            FlagIcon,
            GifIcon,
            HeartIcon,
            MessageIcon,
            MoreIcon,
            SmileIcon,
            StickerIcon,
            Textarea,
            TrashIcon,'''.replace("            ", "  ")
          if old_imports not in source:
              raise SystemExit("CommentThread icon import anchor not found")
          source = source.replace(old_imports, new_imports, 1)

          old_toolbar = '''                <button
                  type="button"
                  aria-expanded={mediaKind === "GIF"}
                  onClick={() => setMediaKind(mediaKind === "GIF" ? null : "GIF")}
                >
                  GIF
                </button>
                <button
                  type="button"
                  aria-expanded={mediaKind === "STICKER"}
                  onClick={() => setMediaKind(mediaKind === "STICKER" ? null : "STICKER")}
                >
                  Sticker
                </button>
                <button
                  type="button"
                  aria-expanded={mediaKind === "EMOTE"}
                  onClick={() => setMediaKind(mediaKind === "EMOTE" ? null : "EMOTE")}
                >
                  Emote
                </button>'''
          new_toolbar = '''                <button
                  className={`product-comment-composer__media-action${mediaKind === "GIF" ? " is-active" : ""}`}
                  type="button"
                  aria-label="GIF"
                  title="GIF"
                  aria-expanded={mediaKind === "GIF"}
                  onClick={() => setMediaKind(mediaKind === "GIF" ? null : "GIF")}
                >
                  <GifIcon width="20" height="20" />
                </button>
                <button
                  className={`product-comment-composer__media-action${mediaKind === "STICKER" ? " is-active" : ""}`}
                  type="button"
                  aria-label="Sticker"
                  title="Sticker"
                  aria-expanded={mediaKind === "STICKER"}
                  onClick={() => setMediaKind(mediaKind === "STICKER" ? null : "STICKER")}
                >
                  <StickerIcon width="20" height="20" />
                </button>
                <button
                  className={`product-comment-composer__media-action${mediaKind === "EMOTE" ? " is-active" : ""}`}
                  type="button"
                  aria-label="Emote"
                  title="Emote"
                  aria-expanded={mediaKind === "EMOTE"}
                  onClick={() => setMediaKind(mediaKind === "EMOTE" ? null : "EMOTE")}
                >
                  <SmileIcon width="20" height="20" />
                </button>'''
          if old_toolbar not in source:
              raise SystemExit("CommentThread media toolbar anchor not found")
          source = source.replace(old_toolbar, new_toolbar, 1)
          path.write_text(source)
          PY
      - run: npx prettier app/components/product/CommentThread.tsx app/components/ui/icons.tsx app/components/product/comment-actions.css tests/unit/media-picker.test.ts tests/unit/comments-social-actions.test.ts --write
      - run: npx vitest run tests/unit/media-picker.test.ts tests/unit/comments-social-actions.test.ts
      - run: npm run typecheck
      - run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/product/CommentThread.tsx app/components/ui/icons.tsx app/components/product/comment-actions.css tests/unit/media-picker.test.ts tests/unit/comments-social-actions.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(comments): polish composer and overflow controls"
          git push origin HEAD:feature/profile-comments-categories-discovery
