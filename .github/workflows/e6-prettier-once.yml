name: E6 prettier cleanup

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery
    paths:
      - .github/workflows/e6-prettier-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/profile-comments-categories-discovery
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Format E6 files and remove workflow
        run: |
          npx prettier --write app/components/admin/store/AdminPresetLaboratory.tsx app/components/product/CommunityCosmeticStudio.tsx app/components/product/ProfileCosmeticPreview.tsx
          rm .github/workflows/e6-prettier-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/admin/store/AdminPresetLaboratory.tsx app/components/product/CommunityCosmeticStudio.tsx app/components/product/ProfileCosmeticPreview.tsx .github/workflows/e6-prettier-once.yml
          git commit -m "style(cosmetics): format E6 files"
          git push origin HEAD:feature/profile-comments-categories-discovery
