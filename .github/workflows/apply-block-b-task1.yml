name: Apply Block B Task 1 GREEN

on:
  push:
    branches:
      - feature/platform-overhaul-block-b

permissions:
  contents: write

jobs:
  apply-task-1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/platform-overhaul-block-b
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Write final migration and schema mirror
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          schema_path = Path("worker/db/schema.ts")
          schema = schema_path.read_text()
          needle = '''    ipPrefixHash: text("ip_prefix_hash"),
              userAgentHash: text("user_agent_hash"),
          '''
          replacement = '''    ipPrefixHash: text("ip_prefix_hash"),
              userAgentHash: text("user_agent_hash"),
              ipEncrypted: text("ip_encrypted"),
              ipKeyVersion: text("ip_key_version"),
              userAgent: text("user_agent"),
              cfCity: text("cf_city"),
              cfRegion: text("cf_region"),
              cfCountry: text("cf_country"),
              contextUpdatedAt: integer("context_updated_at", { mode: "number" }),
          '''
          if schema.count(needle) != 1:
              raise SystemExit("sessions schema anchor was not found exactly once")
          schema_path.write_text(schema.replace(needle, replacement, 1))

          migration_path = Path("migrations/0031_public_profiles_session_context.sql")
          if migration_path.exists():
              raise SystemExit("0031 already exists; refusing to rewrite an applied migration")
          migration_path.write_text("""UPDATE user_profiles
          SET profile_visibility = 'PUBLIC', updated_at = CAST(strftime('%s','now') AS INTEGER) * 1000
          WHERE profile_visibility <> 'PUBLIC';

          ALTER TABLE sessions ADD COLUMN ip_encrypted TEXT;
          ALTER TABLE sessions ADD COLUMN ip_key_version TEXT;
          ALTER TABLE sessions ADD COLUMN user_agent TEXT;
          ALTER TABLE sessions ADD COLUMN cf_city TEXT;
          ALTER TABLE sessions ADD COLUMN cf_region TEXT;
          ALTER TABLE sessions ADD COLUMN cf_country TEXT;
          ALTER TABLE sessions ADD COLUMN context_updated_at INTEGER;
          """)
          PY
          npx prettier worker/db/schema.ts --write
      - name: Verify Task 1 GREEN before commit
        run: npm test -- --run tests/unit/public-profile-defaults.test.ts tests/unit/session-context-migration.test.ts
      - name: Remove helper workflow and commit Task 1
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-block-b-task1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migrations/0031_public_profiles_session_context.sql worker/db/schema.ts .github/workflows/apply-block-b-task1.yml
          git commit -m 'feat: add public profile and session context migration'
          git push origin HEAD:feature/platform-overhaul-block-b
