name: Temporary Cosmetic Visuals GREEN

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  cosmetic-visuals-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/sourceboard-product-overhaul
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Propagate custom cosmetic visuals
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "worker/posts/service.ts": [
                  (
                      "    nameFont: cosmetics?.nameFont,\n    nameEffect: cosmetics?.nameEffect,\n",
                      "    nameFont: cosmetics?.nameFont,\n    nameEffect: cosmetics?.nameEffect,\n    visuals: cosmetics?.visuals,\n",
                  ),
              ],
              "worker/comments/service.ts": [
                  (
                      "    nameFont: cosmetics?.nameFont,\n    nameEffect: cosmetics?.nameEffect,\n",
                      "    nameFont: cosmetics?.nameFont,\n    nameEffect: cosmetics?.nameEffect,\n    visuals: cosmetics?.visuals,\n",
                  ),
              ],
              "app/components/product/PostCard.tsx": [
                  (
                      "              nameFont={post.author.nameFont}\n              nameEffect={post.author.nameEffect}\n",
                      "              nameFont={post.author.nameFont}\n              nameEffect={post.author.nameEffect}\n              visuals={post.author.visuals}\n",
                  ),
              ],
              "app/components/product/CommentThread.tsx": [
                  (
                      "                nameFont={comment.author.nameFont}\n                nameEffect={comment.author.nameEffect}\n",
                      "                nameFont={comment.author.nameFont}\n                nameEffect={comment.author.nameEffect}\n                visuals={comment.author.visuals}\n",
                  ),
              ],
              "app/components/product/SourceResolution.tsx": [
                  (
                      "            nameFont={comment.author.nameFont}\n            nameEffect={comment.author.nameEffect}\n",
                      "            nameFont={comment.author.nameFont}\n            nameEffect={comment.author.nameEffect}\n            visuals={comment.author.visuals}\n",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one match in {filename}, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - run: npx prettier --write worker/posts/service.ts worker/comments/service.ts app/components/product/PostCard.tsx app/components/product/CommentThread.tsx app/components/product/SourceResolution.tsx tests/unit/global-cosmetic-visuals.test.ts
      - run: npx prettier --check worker/posts/service.ts worker/comments/service.ts app/components/product/PostCard.tsx app/components/product/CommentThread.tsx app/components/product/SourceResolution.tsx tests/unit/global-cosmetic-visuals.test.ts
      - run: npm test -- --run tests/unit/global-cosmetic-visuals.test.ts
      - name: Commit cosmetic propagation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/posts/service.ts worker/comments/service.ts app/components/product/PostCard.tsx app/components/product/CommentThread.tsx app/components/product/SourceResolution.tsx tests/unit/global-cosmetic-visuals.test.ts
          git commit -m "feat: propagate custom cosmetic visuals"
          git push origin HEAD:feature/sourceboard-product-overhaul
