name: Format CI contracts

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul
    paths:
      - tests/unit/admin-control-center.test.ts
      - tests/unit/navigation-performance.test.ts
      - tests/unit/security-hardening.test.ts
      - .github/workflows/format-ci-contracts.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/unit/admin-control-center.test.ts tests/unit/navigation-performance.test.ts tests/unit/security-hardening.test.ts
      - run: npx prettier --check tests/unit/admin-control-center.test.ts tests/unit/navigation-performance.test.ts tests/unit/security-hardening.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "Mairon"
          git config user.email "maironjoelkin430@gmail.com"
          git add tests/unit/admin-control-center.test.ts tests/unit/navigation-performance.test.ts tests/unit/security-hardening.test.ts
          git commit -m "style: format updated CI contracts"
          git push
