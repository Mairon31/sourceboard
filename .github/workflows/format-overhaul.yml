name: Format product overhaul

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul
    paths:
      - .github/workflows/format-overhaul.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Prettier
        run: npx prettier --write .
      - name: Verify whitespace
        run: git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format product overhaul branch"
          git push origin HEAD:feature/sourceboard-product-overhaul
