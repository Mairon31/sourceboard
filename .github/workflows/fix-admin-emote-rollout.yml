name: Fix Admin Emote Rollout

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/fix-admin-emote-rollout.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize regression test
        run: npx prettier --write tests/unit/store-schema-compatibility.test.ts
      - name: Confirm Admin emote regressions are red
        run: |
          if npm test -- --run tests/unit/store-schema-compatibility.test.ts; then
            echo "Expected Admin emote rollout regressions before applying the fix."
            exit 1
          fi
      - name: Apply Admin emote rollout fixes
        run: |
          node scripts/fix-admin-emote-rollout.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/e2e/store.spec.ts';
          let text = fs.readFileSync(path, 'utf8');
          for (const name of ['Stellar Magic', 'Star Dust', 'Lujo Plata']) {
            const from = `page.getByRole("heading", { name: "${name}" })).toBeVisible()`;
            const to = `page.getByRole("heading", { name: "${name}" }).first()).toBeVisible()`;
            text = text.split(from).join(to);
          }
          fs.writeFileSync(path, text);
          NODE
      - name: Normalize fixes
        run: >-
          npx prettier --write
          worker/catalog/api.ts
          worker/store/admin.ts
          app/components/admin/store/AdminEmotePackManager.tsx
          tests/unit/store-schema-compatibility.test.ts
          tests/e2e/test-helpers.ts
          tests/e2e/store.spec.ts
          tests/e2e/admin.spec.ts
      - name: Focused regression tests
        run: npm test -- --run tests/unit/store-schema-compatibility.test.ts tests/unit/store-catalog-redesign.test.ts
      - name: Remove one-shot recovery helpers before global gates
        run: git rm .github/workflows/fix-admin-emote-rollout.yml scripts/fix-admin-emote-rollout.mjs
      - name: Lint and format check
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Worker deploy dry run
        run: npm run deploy:dry-run
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply local D1 migrations
        run: npm run db:migrations:apply
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Commit verified fix
        run: |
          git config user.name "SourceBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore Admin emote pack controls"
          git push origin HEAD:master
