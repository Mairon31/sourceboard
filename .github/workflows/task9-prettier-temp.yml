name: Task 9 Prettier Temp

on:
  push:
    branches:
      - prettier-task9-temp

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/components/product/FriendsWorkspace.tsx app/components/product/ProfileHero.tsx worker/profile/api.ts worker/profile/service.ts worker/profile/store.ts app/routes/friends.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/product/FriendsWorkspace.tsx app/components/product/ProfileHero.tsx worker/profile/api.ts worker/profile/service.ts worker/profile/store.ts app/routes/friends.tsx
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply task9 prettier"
            git push
          fi
