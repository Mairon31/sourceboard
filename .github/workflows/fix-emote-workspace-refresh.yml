name: Fix Emote Workspace Refresh

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply targeted refresh fix
        run: python .github/scripts/fix_emote_workspace_refresh.py
      - name: Format touched files
        run: npx prettier --write app/components/admin/store/AdminEmotePackManager.tsx tests/e2e/admin.spec.ts
      - name: Verify types and focused admin flow
        run: |
          npm run typecheck
          npx playwright install --with-deps chromium
          npm run db:migrations:apply
          npx playwright test tests/e2e/admin.spec.ts --project=chromium
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/admin/store/AdminEmotePackManager.tsx tests/e2e/admin.spec.ts
          git commit -m "fix: refresh draft emotes after upload"
          git push origin HEAD:master
