name: Community border bounds GREEN

on:
  push:
    branches:
      - feature/community-cosmetics-profile-identity-emotes
    paths:
      - .github/workflows/community-border-bounds-green.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/community-cosmetics-profile-identity-emotes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Bound border shorthand widths
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("shared/store/community-css.ts")
          text = path.read_text()
          needle = 'if (property === "border-width")'
          pos = text.find(needle)
          if pos < 0:
              raise SystemExit("border-width condition not found")
          line_start = text.rfind("\n", 0, pos) + 1
          indent = text[line_start:pos]
          insertion = f'{indent}if (property === "border") validateBoundedLengths(value, 8, property);\n'
          text = text[:line_start] + insertion + text[line_start:]
          path.write_text(text)
          PY
      - run: npx prettier --write shared/store/community-css.ts
      - run: npx vitest run tests/unit/community-css-border-bounds.test.ts tests/unit/community-css-animation-isolation.test.ts tests/unit/community-plan-phase-d.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: git diff --check
      - name: Commit verified GREEN and remove temporary gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/community-border-bounds-green.yml
          git add shared/store/community-css.ts tests/unit/community-css-border-bounds.test.ts
          git commit -m "fix(store): bound community border shorthand"
          git push origin HEAD:feature/community-cosmetics-profile-identity-emotes
