name: Format Block B Task 3 E2E

on:
  push:
    branches:
      - feature/platform-overhaul-block-b

permissions:
  contents: write

jobs:
  format-e2e:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/platform-overhaul-block-b
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Format Task 3 E2E and remove helper workflow
        run: |
          npx prettier --write tests/e2e/public-profile-access.spec.ts
          rm .github/workflows/format-block-b-task3-e2e.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/public-profile-access.spec.ts .github/workflows/format-block-b-task3-e2e.yml
          git commit -m "style: format Block B Task 3 E2E"
          git push origin HEAD:feature/platform-overhaul-block-b
