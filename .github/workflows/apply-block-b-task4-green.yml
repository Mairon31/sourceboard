name: Apply Block B Task 4 GREEN

on:
  push:
    branches:
      - feature/platform-overhaul-block-b

permissions:
  contents: write

jobs:
  apply-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/platform-overhaul-block-b
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Apply Task 4 GREEN
        run: python scripts/apply-block-b-task4-green.py
      - name: Verify focused Task 4 gate
        run: |
          npx prettier --write worker/auth/crypto.ts worker/auth/store.ts worker/auth/service.ts tests/unit/navigation-performance.test.ts
          npm run lint
          npm run typecheck
          npm test -- --run tests/unit/auth-session-context.test.ts tests/unit/session-context-migration.test.ts tests/unit/navigation-performance.test.ts tests/unit/auth-service.test.ts
      - name: Commit GREEN and remove helpers
        run: |
          rm .github/workflows/apply-block-b-task4-green.yml scripts/apply-block-b-task4-green.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/auth/crypto.ts worker/auth/store.ts worker/auth/service.ts tests/unit/navigation-performance.test.ts .github/workflows/apply-block-b-task4-green.yml scripts/apply-block-b-task4-green.py
          git commit -m "feat: persist encrypted session context"
          git push origin HEAD:feature/platform-overhaul-block-b
