name: Apply Block C Presenter Refactor

on:
  push:
    branches: [feature/platform-overhaul-block-c]
    paths: [.github/workflows/block-c-presenter-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/platform-overhaul-block-c
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Refactor notification presenter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("worker/notifications/presenter.ts")
          text = path.read_text()
          needle = 'import { createD1ProfileStore } from "../profile/store";\n'
          replacement = needle + 'import { groupNotificationCards, type NotificationCardView } from "./grouping";\nimport { notificationPreviewText } from "./preview-text";\n'
          if needle not in text:
              raise SystemExit("presenter import anchor missing")
          text = text.replace(needle, replacement, 1)

          start = text.find("function groupTarget(")
          end = text.find("export async function presentNotifications(")
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("legacy grouping block not found")
          text = text[:start] + text[end:]

          text = text.replace(
              '): Promise<PresentedNotification[]> {',
              '): Promise<NotificationCardView[]> {',
              1,
          )
          old = '  return groupPresentedNotifications(records.map((record) => presentNotification(record, context)));\n}'
          new = '''  return groupNotificationCards(\n    records.map((record) => {\n      const notification = presentNotification(record, context);\n      return {\n        id: notification.id,\n        type: notification.type,\n        entityType: notification.entityType,\n        entityId: notification.entityId,\n        href: notification.href,\n        title: notification.title,\n        ...(notificationPreviewText({ bodyPlaintext: notification.body })\n          ? { preview: notificationPreviewText({ bodyPlaintext: notification.body }) }\n          : {}),\n        ...(notification.ctaLabel ? { ctaLabel: notification.ctaLabel } : {}),\n        createdAt: notification.createdAt,\n        unread: !notification.readAt,\n        ...(notification.actor\n          ? {\n              actor: {\n                userId: notification.actor.id,\n                id: notification.actor.id,\n                username: notification.actor.username,\n                displayName: notification.actor.displayName,\n                ...(notification.actor.avatarUrl\n                  ? { avatarUrl: notification.actor.avatarUrl }\n                  : {}),\n                ...(notification.actor.cosmetics\n                  ? { cosmetics: notification.actor.cosmetics }\n                  : {}),\n              },\n            }\n          : {}),\n      };\n    }),\n  );\n}'''
          if old not in text:
              raise SystemExit("presenter return anchor missing")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          npx prettier --write worker/notifications/presenter.ts
      - run: npm test -- --run tests/unit/notification-grouping.test.ts tests/unit/notification-preview-text.test.ts
      - run: npm run typecheck
      - name: Commit clean product diff
        run: |
          git rm .github/workflows/block-c-presenter-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/notifications/presenter.ts
          git diff --cached --check
          git commit -m "refactor: project canonical notification cards"
          git push origin HEAD:feature/platform-overhaul-block-c
