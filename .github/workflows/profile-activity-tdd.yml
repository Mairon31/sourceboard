name: Profile activity TDD

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  profile-activity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply profile activity implementation
        if: github.event.head_commit.message == 'chore(profile): apply activity implementation'
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              "worker/posts/store.ts",
              '''  listFeed(input: {
              viewerId: string | null;
              kind: FeedKind;
              cursor: PostCursor | null;
              limit: number;
            }): Promise<{ posts: PostWithAuthor[]; nextCursor: string | null }>;
            updatePost(input: {''',
              '''  listFeed(input: {
              viewerId: string | null;
              kind: FeedKind;
              cursor: PostCursor | null;
              limit: number;
            }): Promise<{ posts: PostWithAuthor[]; nextCursor: string | null }>;
            listByAuthor(input: {
              authorId: string;
              cursor: PostCursor | null;
              limit: number;
            }): Promise<{ posts: PostWithAuthor[]; nextCursor: string | null }>;
            updatePost(input: {''',
          )

          replace_once(
              "worker/posts/store.ts",
              '''      return {
                    posts: rows.map(toPost),
                    nextCursor:
                      hasNextPage && last
                        ? encodePostCursor({ createdAt: last.created_at, id: last.id })
                        : null,
                  };
                },

                async updatePost({''',
              '''      return {
                    posts: rows.map(toPost),
                    nextCursor:
                      hasNextPage && last
                        ? encodePostCursor({ createdAt: last.created_at, id: last.id })
                        : null,
                  };
                },

                async listByAuthor({ authorId, cursor, limit }) {
                  const conditions = [
                    "p.author_id = ?",
                    "p.deleted_at IS NULL",
                    "p.hidden_at IS NULL",
                    "m.status = 'ACTIVE'",
                    "m.purpose = 'POST_IMAGE'",
                  ];
                  const bindings: unknown[] = [authorId];
                  if (cursor) {
                    conditions.push("(p.created_at < ? OR (p.created_at = ? AND p.id < ?))");
                    bindings.push(cursor.createdAt, cursor.createdAt, cursor.id);
                  }
                  const result = await db
                    .prepare(
                      `${postQuery(conditions.join(" AND "))} ORDER BY p.created_at DESC, p.id DESC LIMIT ?`,
                    )
                    .bind(...bindings, limit + 1)
                    .all<PostWithAuthorRow>();
                  const hasNextPage = result.results.length > limit;
                  const rows = hasNextPage ? result.results.slice(0, limit) : result.results;
                  const last = rows.at(-1);
                  return {
                    posts: rows.map(toPost),
                    nextCursor:
                      hasNextPage && last
                        ? encodePostCursor({ createdAt: last.created_at, id: last.id })
                        : null,
                  };
                },

                async updatePost({''',
          )

          replace_once(
              "worker/posts/service.ts",
              '''  listFeed(input: {
              viewerId: string | null;
              kind: FeedKind;
              cursor: string | null;
              limit: number;
            }): Promise<{ posts: PostSummary[]; nextCursor: string | null }>;
            updatePost(''',
              '''  listFeed(input: {
              viewerId: string | null;
              kind: FeedKind;
              cursor: string | null;
              limit: number;
            }): Promise<{ posts: PostSummary[]; nextCursor: string | null }>;
            listProfileActivity(input: {
              authorId: string;
              viewerId: string | null;
              limit: number;
            }): Promise<{ posts: PostSummary[] }>;
            updatePost(''',
          )

          replace_once(
              "worker/posts/service.ts",
              '''}

            function authorForPost(''',
              '''}

            async function canListPostOnProfile(
              viewerId: string | null,
              post: PostRecord,
              dependencies: { profileStore: ProfileStore; store: PostStore; now: () => number },
            ): Promise<boolean> {
              const isOwner = viewerId === post.authorId;
              if (!isOwner && (post.authorMode === "ANONYMOUS" || post.visibility === "UNLISTED")) {
                return false;
              }
              return canViewPost(viewerId, post, dependencies);
            }

            function authorForPost(''',
          )

          replace_once(
              "worker/posts/service.ts",
              '''      return { posts: visible, nextCursor };
                },

                async updatePost(postId, editorUserId, input) {''',
              '''      return { posts: visible, nextCursor };
                },

                async listProfileActivity({ authorId, viewerId, limit }) {
                  const safeLimit = Math.min(Math.max(1, Math.floor(limit)), MAX_FEED_LIMIT);
                  let decodedCursor = decodePostCursor(null);
                  const visible: PostSummary[] = [];
                  for (let page = 0; page < 5 && visible.length < safeLimit; page += 1) {
                    const result = await dependencies.store.listByAuthor({
                      authorId,
                      cursor: decodedCursor,
                      limit: safeLimit * 2,
                    });
                    for (const post of result.posts) {
                      if (await canListPostOnProfile(viewerId, post.post, policyDependencies)) {
                        visible.push(await toPostSummary(post, viewerId, policyDependencies));
                        if (visible.length >= safeLimit) break;
                      }
                    }
                    if (!result.nextCursor) break;
                    decodedCursor = decodePostCursor(result.nextCursor);
                  }
                  return { posts: visible };
                },

                async updatePost(postId, editorUserId, input) {''',
          )

          replace_once(
              "app/routes/profile.tsx",
              '''import { createProfileService } from "../../worker/profile/service";
            import { createReputationReader } from "../../worker/reputation/read";''',
              '''import { createProfileService } from "../../worker/profile/service";
            import { createD1PostStore } from "../../worker/posts/store";
            import { createPostService } from "../../worker/posts/service";
            import { createReputationReader } from "../../worker/reputation/read";''',
          )

          replace_once(
              "app/routes/profile.tsx",
              '''import { ProfileAccountActions } from "../components/product/ProfileAccountActions";
            import { ProfileEditor } from "../components/product/ProfileEditor";''',
              '''import { ProfileAccountActions } from "../components/product/ProfileAccountActions";
            import { ProfileActivity } from "../components/product/ProfileActivity";
            import { ProfileEditor } from "../components/product/ProfileEditor";''',
          )

          replace_once(
              "app/routes/profile.tsx",
              '''export async function loader({ params, request, context }: LoaderArgs) {
              const [profileResult, adminAccess] = await Promise.all([
                withServerSession(
                  request,
                  context,
                  (unavailable) => ({ profile: null, unavailable }),
                  async (runtime, userId) => ({
                    profile: await createProfileService({
                      store: createD1ProfileStore(runtime.db),
                      reputation: createReputationReader(runtime.db),
                    }).getPublicProfile(params.username ?? "", userId),
                    unavailable: false,
                  }),
                ),
                loadAdminAccess(request, context),
              ]);
              return { ...profileResult, canAccessAdmin: adminAccess.authorized };
            }''',
              '''export async function loader({ params, request, context }: LoaderArgs) {
              const [profileResult, adminAccess] = await Promise.all([
                withServerSession(
                  request,
                  context,
                  (unavailable) => ({ profile: null, activityPosts: [], unavailable }),
                  async (runtime, userId) => {
                    const profileStore = createD1ProfileStore(runtime.db);
                    const profile = await createProfileService({
                      store: profileStore,
                      reputation: createReputationReader(runtime.db),
                    }).getPublicProfile(params.username ?? "", userId);
                    if (!profile) return { profile: null, activityPosts: [], unavailable: false };
                    const activity = await createPostService({
                      store: createD1PostStore(runtime.db),
                      profileStore,
                    }).listProfileActivity({ authorId: profile.id, viewerId: userId, limit: 24 });
                    return { profile, activityPosts: activity.posts, unavailable: false };
                  },
                ),
                loadAdminAccess(request, context),
              ]);
              return { ...profileResult, canAccessAdmin: adminAccess.authorized };
            }''',
          )

          replace_once(
              "app/routes/profile.tsx",
              '''  const { profile, unavailable, canAccessAdmin } = useLoaderData<LoaderData>();''',
              '''  const { profile, activityPosts, unavailable, canAccessAdmin } = useLoaderData<LoaderData>();''',
          )

          replace_once(
              "app/routes/profile.tsx",
              '''      {!editingProfile ? (
                    <div className="product-profile-secondary">
                      <ContributionHistory profile={profile} />
                      {isOwnProfile ? <ProfileAccountActions canAccessAdmin={canAccessAdmin} /> : null}
                    </div>
                  ) : null}''',
              '''      {!editingProfile ? (
                    <>
                      <div className="product-profile-secondary">
                        <ContributionHistory profile={profile} />
                        {isOwnProfile ? <ProfileAccountActions canAccessAdmin={canAccessAdmin} /> : null}
                      </div>
                      <ProfileActivity posts={activityPosts} />
                    </>
                  ) : null}''',
          )

          css_path = Path("app/components/product/profile-layout-polish.css")
          css = css_path.read_text()
          if ".product-profile-activity {" in css:
              raise SystemExit("profile activity CSS already exists")
          css_path.write_text(css.rstrip() + '''

            .product-profile-activity {
              display: grid;
              min-width: 0;
              gap: 14px;
              padding-top: 4px;
            }

            .product-profile-activity__header {
              display: flex;
              min-width: 0;
              align-items: end;
              justify-content: space-between;
              gap: 16px;
              padding-bottom: 12px;
              border-bottom: 1px solid var(--border-subtle);
            }

            .product-profile-activity__header > div:first-child {
              display: grid;
              min-width: 0;
              gap: 3px;
            }

            .product-profile-activity__header h2,
            .product-profile-activity__header p {
              margin: 0;
            }

            .product-profile-activity__header h2 {
              color: var(--text-primary);
              font-size: clamp(1rem, 1.8vw, 1.2rem);
              line-height: 1.2;
            }

            .product-profile-activity__header p {
              max-width: 62ch;
              color: var(--text-muted);
              font-size: 0.76rem;
              line-height: 1.45;
            }

            .product-profile-activity__tabs {
              display: inline-flex;
              flex: 0 0 auto;
              align-items: center;
              gap: 4px;
              padding: 3px;
              border: 1px solid var(--border-subtle);
              border-radius: 999px;
              background: var(--surface-glass-soft);
            }

            .product-profile-activity__tabs button {
              display: inline-flex;
              min-height: 34px;
              align-items: center;
              gap: 6px;
              border: 0;
              border-radius: 999px;
              background: transparent;
              padding: 7px 11px;
              color: var(--text-muted);
              font: inherit;
              font-size: 0.75rem;
              cursor: pointer;
            }

            .product-profile-activity__tabs button:hover,
            .product-profile-activity__tabs button:focus-visible {
              color: var(--text-primary);
              background: color-mix(in srgb, var(--surface-glass-soft) 78%, transparent);
            }

            .product-profile-activity__tabs button.is-active {
              color: var(--text-primary);
              background: var(--surface-elevated);
              box-shadow: var(--shadow-xs);
            }

            .product-profile-activity__tabs button span {
              color: var(--text-muted);
              font-size: 0.68rem;
            }

            .product-profile-activity__list {
              display: grid;
              min-width: 0;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 14px;
            }

            @media (max-width: 820px) {
              .product-profile-activity__header {
                align-items: start;
                flex-direction: column;
              }

              .product-profile-activity__list {
                grid-template-columns: minmax(0, 1fr);
              }
            }

            @media (max-width: 520px) {
              .product-profile-activity__tabs {
                width: 100%;
              }

              .product-profile-activity__tabs button {
                flex: 1 1 0;
                justify-content: center;
              }
            }
            ''')
          PY
      - name: Format changed files
        if: github.event.head_commit.message == 'chore(profile): apply activity implementation'
        run: npx prettier --write worker/posts/store.ts worker/posts/service.ts app/routes/profile.tsx app/components/product/profile-layout-polish.css tests/unit/post-policy.test.ts
      - name: Lint changed TypeScript
        if: github.event.head_commit.message == 'chore(profile): apply activity implementation'
        run: npx eslint worker/posts/store.ts worker/posts/service.ts app/routes/profile.tsx tests/unit/post-policy.test.ts
      - name: Run profile activity policy tests
        run: npm test -- tests/unit/post-policy.test.ts
      - name: Commit implementation
        if: github.event.head_commit.message == 'chore(profile): apply activity implementation' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/posts/store.ts worker/posts/service.ts app/routes/profile.tsx app/components/product/profile-layout-polish.css tests/unit/post-policy.test.ts
          git commit -m "feat(profile): wire privacy-safe activity"
          git push origin HEAD:feature/sourceboard-product-overhaul
