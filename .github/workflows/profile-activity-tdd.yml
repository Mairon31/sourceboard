name: Profile activity TDD

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  profile-activity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run profile activity regressions
        run: npm test -- tests/unit/post-policy.test.ts tests/unit/product-mobile-ux.test.ts
