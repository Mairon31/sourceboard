name: Profile activity verification

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: read

jobs:
  profile-activity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npx prettier --check worker/posts/store.ts worker/posts/service.ts app/routes/profile.tsx app/components/product/profile-layout-polish.css tests/unit/post-policy.test.ts tests/unit/product-mobile-ux.test.ts
      - name: Lint profile activity files
        run: npx eslint worker/posts/store.ts worker/posts/service.ts app/routes/profile.tsx tests/unit/post-policy.test.ts tests/unit/product-mobile-ux.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Run profile activity regressions
        run: npm test -- tests/unit/post-policy.test.ts tests/unit/product-mobile-ux.test.ts
