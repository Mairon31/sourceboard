name: Profile and auth verification

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: read

jobs:
  profile-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npx prettier --check worker/auth/api.ts worker/posts/store.ts worker/posts/service.ts app/routes/profile.tsx app/components/product/profile-layout-polish.css tests/unit/post-policy.test.ts tests/unit/product-mobile-ux.test.ts
      - name: Lint changed TypeScript
        run: npx eslint worker/auth/api.ts worker/posts/store.ts worker/posts/service.ts app/routes/profile.tsx tests/unit/post-policy.test.ts tests/unit/product-mobile-ux.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Run profile and auth regressions
        run: npm test -- tests/unit/post-policy.test.ts tests/unit/product-mobile-ux.test.ts tests/unit/auth-form-requests.test.ts tests/unit/auth-security.test.ts tests/unit/auth-service.test.ts tests/unit/google-auth-hosting.test.ts
