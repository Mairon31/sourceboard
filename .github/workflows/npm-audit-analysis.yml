name: Dependency audit analysis

on:
  push:
    branches: [feature/sourceboard-product-overhaul]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Runtime dependency audit
        run: npm audit --omit=dev --json || true
      - name: Full dependency audit
        run: npm audit --json || true
