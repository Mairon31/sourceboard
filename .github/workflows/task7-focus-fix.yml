name: Task 7 focus fix

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery
    paths:
      - .github/workflows/task7-focus-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/profile-comments-categories-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Apply deterministic focus coordination
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/components/product/CommentThread.tsx")
          text = path.read_text()

          anchor = "  const submitInFlightRef = useRef(false);\n"
          replacement = anchor + "  const pendingFocusIdRef = useRef<string | null>(null);\n"
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit("submit ref anchor not found")
              text = text.replace(anchor, replacement, 1)

          old_focus = '''  function focusCreatedComment(id: string) {
    window.requestAnimationFrame(() => {
      window.requestAnimationFrame(() => {
        const target = document.getElementById(`comment-${id}`);
        if (!(target instanceof HTMLElement)) return;
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
        target.focus({ preventScroll: true });
        window.history.replaceState(
          window.history.state,
          "",
          `${window.location.pathname}${window.location.search}#comment-${encodeURIComponent(id)}`,
        );
      });
    });
  }
'''
          new_focus = '''  useEffect(() => {
    const id = pendingFocusIdRef.current;
    if (!id) return;

    let secondFrame = 0;
    const firstFrame = window.requestAnimationFrame(() => {
      secondFrame = window.requestAnimationFrame(() => {
        const target = document.getElementById(`comment-${id}`);
        if (!(target instanceof HTMLElement)) return;
        pendingFocusIdRef.current = null;
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
        target.focus({ preventScroll: true });
        window.history.replaceState(
          window.history.state,
          "",
          `${window.location.pathname}${window.location.search}#comment-${encodeURIComponent(id)}`,
        );
      });
    });

    return () => {
      window.cancelAnimationFrame(firstFrame);
      if (secondFrame) window.cancelAnimationFrame(secondFrame);
    };
  }, [items]);
'''
          if new_focus not in text:
              if old_focus not in text:
                  raise SystemExit("focus function anchor not found")
              text = text.replace(old_focus, new_focus, 1)

          old_submit = '''      const created = payload.comment;
      setItems((current) => insertRootComment(current, created, sort));
'''
          new_submit = '''      const created = payload.comment;
      pendingFocusIdRef.current = created.id;
      setItems((current) => insertRootComment(current, created, sort));
'''
          if new_submit not in text:
              if old_submit not in text:
                  raise SystemExit("submit insertion anchor not found")
              text = text.replace(old_submit, new_submit, 1)

          text = text.replace('      focusCreatedComment(created.id);\n', '', 1)
          path.write_text(text)
          PY
          npx prettier --write app/components/product/CommentThread.tsx
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrations:apply
      - name: Repeat post-submit focus without retries
        run: npx playwright test tests/e2e/comments.spec.ts --grep "freshly submitted root comment" --repeat-each=10 --retries=0
      - name: Commit verified fix and remove temporary diagnostics
        run: |
          git config user.name "Mairon"
          git config user.email "maironjoelkin430@gmail.com"
          git rm -f .github/workflows/task5-focus-diagnostic.yml .github/workflows/task7-focus-fix.yml
          git add app/components/product/CommentThread.tsx
          git diff --cached --check
          git commit -m "fix(comments): coordinate focus after render"
          git push origin HEAD:feature/profile-comments-categories-discovery
