name: Task 10 Name Effects Apply

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/task10-name-effects-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply NAME_EFFECT implementation
        run: python .github/scripts/task10_name_effects.py
      - name: Format touched source files
        run: npx prettier --write shared/store/cosmetics.ts shared/ui/contracts.ts worker/db/schema.ts worker/store/service.ts worker/store/api.ts worker/profile/types.ts worker/profile/store-core.ts worker/posts/service.ts worker/comments/service.ts app/components/product/CosmeticIdentity.tsx app/components/product/ProfileHero.tsx app/components/product/PostCard.tsx app/components/product/CommentThread.tsx app/components/product/SourceResolution.tsx app/components/product/PostComposer.tsx app/components/product/StoreItemCard.tsx app/components/product/store-effects.css app/routes/store.tsx app/routes/admin-store.tsx app/components/admin/store/AdminCosmeticCatalog.tsx
      - name: Verify Task 10 contracts
        run: npm test -- tests/unit/store-effects.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/store/cosmetics.ts shared/ui/contracts.ts worker/db/schema.ts worker/store/service.ts worker/store/api.ts worker/profile/types.ts worker/profile/store-core.ts worker/posts/service.ts worker/comments/service.ts app/components/product/CosmeticIdentity.tsx app/components/product/ProfileHero.tsx app/components/product/PostCard.tsx app/components/product/CommentThread.tsx app/components/product/SourceResolution.tsx app/components/product/PostComposer.tsx app/components/product/StoreItemCard.tsx app/components/product/store-effects.css app/routes/store.tsx app/routes/admin-store.tsx app/components/admin/store/AdminCosmeticCatalog.tsx migrations/0016_name_effect_catalog.sql
          git commit -m "feat: add purchasable name effects"
          git push origin HEAD:master
