name: Format comment hotfix

on:
  push:
    paths:
      - .github/workflows/format-comment-hotfix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --progress=false
      - name: Format touched files
        run: npx prettier --write app/components/product/CommentThread.tsx shared/richtext/markdown.ts tests/unit/media-picker.test.ts worker/comments/richtext.ts app/components/ui/overlays.tsx app/components/ui/icons.tsx app/components/product/comment-actions.css app/root.tsx
      - name: Commit formatting
        run: |
          git config user.name "sourceboard-builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/components/product/CommentThread.tsx shared/richtext/markdown.ts tests/unit/media-picker.test.ts worker/comments/richtext.ts app/components/ui/overlays.tsx app/components/ui/icons.tsx app/components/product/comment-actions.css app/root.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format comment emote hotfix"
          git push origin master
