name: Store admin state TDD

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  store-admin-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply implementation
        if: "${{ github.event.head_commit.message == 'chore(store): apply admin state integrity' }}"
        run: python .github/scripts/apply-store-admin-state-integrity.py
      - name: Format changed files
        if: "${{ github.event.head_commit.message == 'chore(store): apply admin state integrity' }}"
        run: npx prettier --write worker/store/admin.ts worker/catalog/api.ts app/components/admin/store/AdminEmotePackManager.tsx tests/unit/store-catalog-redesign.test.ts
      - name: Lint changed files
        if: "${{ github.event.head_commit.message == 'chore(store): apply admin state integrity' }}"
        run: npx eslint worker/store/admin.ts worker/catalog/api.ts app/components/admin/store/AdminEmotePackManager.tsx tests/unit/store-catalog-redesign.test.ts
      - name: Typecheck
        if: "${{ github.event.head_commit.message == 'chore(store): apply admin state integrity' }}"
        run: npm run typecheck
      - name: Run Store tests
        run: npm test -- tests/unit/store-catalog-redesign.test.ts tests/unit/store-refresh.test.ts tests/unit/store-schema-compatibility.test.ts
      - name: Commit implementation
        if: "${{ github.event.head_commit.message == 'chore(store): apply admin state integrity' && success() }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/store/admin.ts worker/catalog/api.ts app/components/admin/store/AdminEmotePackManager.tsx tests/unit/store-catalog-redesign.test.ts
          git commit -m "fix(store): enforce archived catalog integrity"
          git push origin HEAD:feature/sourceboard-product-overhaul
