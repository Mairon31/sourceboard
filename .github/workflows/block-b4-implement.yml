name: Block B4 implementation gate

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery
    paths:
      - .github/workflows/block-b4-implement.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/profile-comments-categories-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Apply Block B Task 4
        run: |
          sed -i 's/^    }"""$/    },"""/' .github/scripts/block_b4_patch.py
          python .github/scripts/block_b4_patch.py
          npx prettier --write worker/comments/types.ts worker/comments/richtext.ts worker/comments/store.ts worker/comments/service.ts worker/comments/link-preview.ts worker/comments/api.ts
      - name: Focused Task B4 tests
        run: npx vitest run tests/unit/link-preview-persistence.test.ts tests/unit/link-preview.test.ts tests/unit/link-preview-migration.test.ts
      - run: npm run typecheck
      - run: npm run db:migrations:apply
      - name: Commit verified implementation and remove temporary tooling
        run: |
          git config user.name "Mairon"
          git config user.email "maironjoelkin430@gmail.com"
          git rm -f .github/workflows/block-b4-implement.yml .github/scripts/block_b4_patch.py
          git add worker/comments/types.ts worker/comments/richtext.ts worker/comments/store.ts worker/comments/service.ts worker/comments/link-preview.ts worker/comments/api.ts
          git diff --cached --check
          git commit -m "feat(comments): persist and proxy link previews"
          git push origin HEAD:feature/profile-comments-categories-discovery
