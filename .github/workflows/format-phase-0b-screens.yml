name: Format Phase 0B Screens

on:
  push:
    branches:
      - phase-0b-ui-ux

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-0b-ui-ux
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/components/layout/TopBar.tsx app/components/product app/components/admin app/routes app/root.tsx tests/e2e
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/layout/TopBar.tsx app/components/product app/components/admin app/routes app/root.tsx tests/e2e
          git commit -m "style: format phase 0b product surfaces"
          git push origin HEAD:phase-0b-ui-ux
