name: Block B Task 1 RED

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery
    paths:
      - .github/workflows/block-b-task1-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/profile-comments-categories-discovery
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - run: npx vitest run tests/unit/link-preview-migration.test.ts
