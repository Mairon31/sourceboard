name: Append Block A progress evidence

on:
  push:
    branches:
      - feature/platform-overhaul-block-a

permissions:
  contents: write

jobs:
  append-progress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/platform-overhaul-block-a
      - name: Append verified Block A evidence
        shell: bash
        run: |
          set -euo pipefail
          marker='## Platform Overhaul — Block A: Social correctness, sharing and immediate UI repair'
          if grep -Fq "$marker" docs/IMPLEMENTATION_PROGRESS.md; then
            echo 'Block A evidence is already present.'
          else
            cat >> docs/IMPLEMENTATION_PROGRESS.md <<'EOF'

          ## Platform Overhaul — Block A: Social correctness, sharing and immediate UI repair

          Status: **COMPLETED IN DRAFT PR #34 — pending merge and production deployment**

          Implemented on `feature/platform-overhaul-block-a` against the approved
          `2026-09-12-sourceboard-platform-overhaul-design.md` specification and the
          Block A execution plan.

          ### Block A completed scope

          - [x] Post detail now projects the authenticated viewer's persisted Like state on
                first SSR render and after reload instead of defaulting to an inactive Like.
          - [x] Stable opaque Base62 share links are persisted in D1 through
                `0030_share_links.sql`, remain stable per post/comment resource and retry
                collisions without swallowing unrelated database constraint failures.
          - [x] Share-link creation reuses the existing post/comment visibility domain
                rules, including anonymous-view restrictions, and does not leak unavailable
                targets.
          - [x] `ShareAction` resolves a stable short URL immediately before native share
                or clipboard copy, preserves the allowlisted `en|es|pt|fr|ru|de` locale,
                and falls back to the canonical URL only for temporary 5xx failures rather
                than silently weakening 404/unavailable handling.
          - [x] SSR `/sh/:shortId` provides canonical, Open Graph/Twitter and `noindex`
                unfurl metadata before client navigation; comments resolve to their post
                anchor and inaccessible resources expose no private target metadata.
          - [x] Random paths and inaccessible post/profile/share targets use the same
                reusable animated 404/unavailable surface with reduced-motion support.
          - [x] Anonymous authors use one local non-correlatable avatar that accepts no
                identity-derived seed, initials, private avatar URL, frame, effect or font
                data.
          - [x] Profile identity layout reserves real avatar space on compact viewports,
                avoiding display-name collisions, and comment summaries distinguish total
                comments from nested replies using recursive counts.
          - [x] GIF, sticker and emote picker presentation is separated by media type:
                GIFs preserve natural media geometry, stickers/emotes use non-overlapping
                square `contain` cells, safe-area/dynamic-viewport limits are enforced and
                the picker auto-scrolls into the visible viewport without a secondary
                image-load jump. Existing cache, debounce, AbortController and entitlement
                behavior remains intact.

          ### Block A TDD and verification evidence

          - Share-link visibility and collision hardening used explicit RED checkpoints;
            the hardened Tasks 2–3 candidate was fully green in CI run `#1532`
            (`34712976562`) at `3481c888c38c49ae565208d6537848d488af1bba`.
          - The profile/comment-layout regression contracts were validated by CI run
            `#1576`, including a real 390×844 bounding-box collision check.
          - Task 9 established RED in CI run `#1577`: all 452 pre-existing tests passed
            while only the new media-picker renderer contract failed. CI run `#1584`
            later exposed a real browser defect: all 179 existing E2E cases passed while
            the four new viewport cases showed that the inline picker could extend below
            the visible viewport. The implementation was fixed at the cause rather than
            weakening the viewport assertion.
          - Final pre-documentation candidate `91ec0042273e8b0af91f4a4d50ee3d0e5adea9d6`
            passed the complete standard gate in GitHub Actions CI run `#1586`
            (`34722092117`): production dependency audit reported **0 vulnerabilities**;
            ESLint/Prettier and strict TypeScript passed; **103 unit-test files / 453 unit
            tests** passed; production build and Worker deploy dry-run passed; **31/31
            local D1 migrations** applied successfully; and **183/183 Playwright E2E
            tests** passed.
          - The focused unit and browser files named by Task 10 are included in those full
            suites. They were not separately re-run as standalone commands, so this record
            intentionally cites the stronger full-suite CI evidence rather than claiming
            a separate focused execution.

          ### Block A release boundary

          Block A is complete in Draft PR #34 and verified against the local/CI Cloudflare
          runtime. This checkpoint does **not** claim that PR #34 has been merged or that
          migration `0030` and the Block A application changes have been deployed to the
          production Worker/D1 database. Those remain integration/release actions after
          review and the broader Platform Overhaul sequence.
          EOF
          fi
      - name: Remove temporary workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/append-block-a-progress.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/IMPLEMENTATION_PROGRESS.md .github/workflows/append-block-a-progress.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'docs: record Platform Overhaul Block A verification'
          git push origin HEAD:feature/platform-overhaul-block-a
