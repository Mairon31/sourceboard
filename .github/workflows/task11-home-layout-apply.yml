name: Task 11 Home Layout Apply

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/task11-home-layout-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply desktop home and responsive styles
        run: python .github/scripts/task11_home_layout.py
      - name: Format touched files
        run: npx prettier --write app/components/product/product.css app/components/product/product-interactions.css app/components/product/store-responsive.css app/routes/_index.tsx
      - name: Verify static gates
        run: npm run typecheck && npm test
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/_index.tsx app/components/product/product.css app/components/product/product-interactions.css app/components/product/store-responsive.css
          git commit -m "style: refine desktop home and responsive navigation"
          git push origin HEAD:master
