name: Task 10 Format Tests

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/task10-format-tests.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/store.spec.ts tests/unit/store-refresh.test.ts
      - run: npm test -- tests/unit/store-effects.test.ts tests/unit/store-refresh.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/store.spec.ts tests/unit/store-refresh.test.ts
          git commit -m "test: format name effect coverage"
          git push origin HEAD:master
