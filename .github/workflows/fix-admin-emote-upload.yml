name: Fix Admin Emote Upload

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply targeted fix
        run: python .github/scripts/fix_admin_emote_upload.py
      - name: Format touched files
        run: npx prettier --write worker/catalog/api.ts app/components/admin/store/AdminEmotePackManager.tsx tests/unit/store-schema-compatibility.test.ts tests/e2e/admin.spec.ts
      - name: Verify regression and types
        run: |
          npx vitest run tests/unit/store-schema-compatibility.test.ts
          npm run typecheck
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/catalog/api.ts app/components/admin/store/AdminEmotePackManager.tsx tests/unit/store-schema-compatibility.test.ts tests/e2e/admin.spec.ts
          git commit -m "fix: recover admin emote uploads"
          git push origin HEAD:master
