name: Format task 7 baseline

on:
  push:
    paths:
      - .github/workflows/format-task7-baseline.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --progress=false
      - name: Format task 7 files
        run: npx prettier --write app/components/product/PostCard.tsx app/components/product/SourceResolution.tsx app/components/product/source-resolution.css app/routes/post-detail.tsx
      - name: Commit formatting
        run: |
          git config user.name "sourceboard-builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/components/product/PostCard.tsx app/components/product/SourceResolution.tsx app/components/product/source-resolution.css app/routes/post-detail.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format task 7 baseline"
          git push origin master
