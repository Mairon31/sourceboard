name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Normalize post refresh formatting
        run: |
          npx prettier --write app/components/product/PostCard.tsx app/routes/_index.tsx
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/components/product/PostCard.tsx app/routes/_index.tsx
            git commit -m "style: normalize post refresh formatting"
            git push origin HEAD:master
          fi
      - name: Lint and format check
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Worker deploy dry run
        run: npm run deploy:dry-run
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply local D1 migrations
        run: npm run db:migrations:apply
      - name: End-to-end tests
        run: npm run test:e2e
