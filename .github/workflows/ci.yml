name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --strict-allow-scripts
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Diagnose lint and formatting
        run: |
          set +e
          npx eslint . -f json > eslint-report.json
          echo "$?" > eslint-status.txt
          npx prettier --check . > prettier-check.txt 2>&1
          echo "$?" > prettier-status.txt
          npx prettier --write . > /dev/null 2>&1
          git diff -- . ':!.github/workflows/ci.yml' > prettier.patch
          exit 0
      - name: Upload lint and formatting diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: lint-format-diagnostics
          path: |
            eslint-report.json
            eslint-status.txt
            prettier-check.txt
            prettier-status.txt
            prettier.patch
          if-no-files-found: error
      - name: Stop after diagnostics
        run: exit 1
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Worker deploy dry run
        run: npm run deploy:dry-run
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply local D1 migrations
        run: npm run db:migrations:apply
      - name: End-to-end tests
        run: npm run test:e2e
