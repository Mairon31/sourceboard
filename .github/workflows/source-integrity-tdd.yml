name: Source integrity TDD

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/sourceboard-product-overhaul
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply capability fix
        run: python .github/scripts/apply-source-capability-fix.py
      - name: Format source policy
        run: npx prettier --write worker/source/api.ts tests/unit/source-integrity-capabilities.test.ts
      - name: Focused source integrity test
        run: npm test -- tests/unit/source-integrity-capabilities.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit product fix
        run: |
          if git diff --quiet -- worker/source/api.ts tests/unit/source-integrity-capabilities.test.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/source/api.ts tests/unit/source-integrity-capabilities.test.ts
          git commit -m "fix(source): enforce verification revoke capability"
          git push origin HEAD:feature/sourceboard-product-overhaul
