name: Source integrity TDD

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/sourceboard-product-overhaul
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- tests/unit/source-integrity-capabilities.test.ts
