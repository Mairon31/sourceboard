name: Task 5 focus diagnostic

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery

permissions:
  contents: read

jobs:
  repeat-focus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrations:apply
      - run: npx playwright test tests/e2e/comments.spec.ts --grep "freshly submitted root comment" --repeat-each=10 --retries=0
