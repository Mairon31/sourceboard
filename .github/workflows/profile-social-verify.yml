name: Profile social verification

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: read

jobs:
  profile-social:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply local D1 migrations
        run: npm run db:migrations:apply
      - name: Run profile and social unit tests
        run: npm test -- tests/unit/profile-friends-workspace.test.ts tests/unit/post-policy.test.ts
      - name: Run profile and responsive browser tests
        run: npx playwright test tests/e2e/profile-api.spec.ts tests/e2e/responsive.spec.ts --project=chromium
      - name: Typecheck
        run: npm run typecheck
