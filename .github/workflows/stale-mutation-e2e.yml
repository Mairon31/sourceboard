name: Stale mutation E2E

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format regression source
        run: npx prettier --write tests/e2e/stale-mutation.spec.ts
      - name: Check regression source
        run: npx eslint tests/e2e/stale-mutation.spec.ts && npx prettier --check tests/e2e/stale-mutation.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/stale-mutation.spec.ts
          git commit -m "style: normalize stale mutation browser regression"
          git push origin HEAD:feature/sourceboard-product-overhaul
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply local D1 migrations
        run: npm run db:migrations:apply
      - name: Verify stale mutation browser flow
        run: npx playwright test tests/e2e/stale-mutation.spec.ts
