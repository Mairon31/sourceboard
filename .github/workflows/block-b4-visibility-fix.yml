name: Block B4 visibility guard

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery
    paths:
      - .github/workflows/block-b4-visibility-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/profile-comments-categories-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Deny preview images for non-visible comments
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("worker/comments/api.ts")
          text = path.read_text()
          old = '      if (!comment?.linkPreview?.imageUrl) {\n'
          new = '      if (!comment?.linkPreview?.imageUrl || comment.comment.state !== "VISIBLE") {\n'
          if new not in text:
              if old not in text:
                  raise SystemExit("preview image guard anchor not found")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          npx prettier --write worker/comments/api.ts
      - run: npx vitest run tests/unit/link-preview.test.ts tests/unit/link-preview-persistence.test.ts
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrations:apply
      - run: npx playwright test tests/e2e/link-preview-persistence.spec.ts --retries=0
      - name: Commit verified guard and remove workflow
        run: |
          git config user.name "Mairon"
          git config user.email "maironjoelkin430@gmail.com"
          git rm -f .github/workflows/block-b4-visibility-fix.yml
          git add worker/comments/api.ts
          git diff --cached --check
          git commit -m "fix(comments): restrict preview images to visible comments"
          git push origin HEAD:feature/profile-comments-categories-discovery
