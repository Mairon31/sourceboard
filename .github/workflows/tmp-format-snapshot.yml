name: Temporary format snapshot

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/sourceboard-product-overhaul
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format known changed files
        run: |
          npx prettier --write \
            app/components/admin/AdminUserControlDialog.tsx \
            app/components/admin/store/AdminCosmeticCatalog.tsx \
            app/components/admin/store/AdminPackStoreCatalog.tsx \
            app/components/layout/TopBar.tsx \
            app/components/product/AuthScreen.tsx \
            app/components/product/cosmetic-visual.ts \
            app/components/product/CosmeticIdentity.tsx \
            app/components/product/custom-cosmetics.css \
            app/components/product/ProfileEditor.tsx \
            app/routes.ts \
            app/routes/_index.tsx \
            app/routes/admin-store.tsx \
            app/routes/admin-users.tsx \
            app/routes/admin-verifications.tsx \
            app/routes/search.tsx \
            shared/profile/social-links.ts \
            shared/store/custom-cosmetics.ts \
            shared/ui/contracts.ts \
            tests/unit/settings-redesign.test.ts \
            worker/admin/user-control.ts \
            worker/comments/api.ts \
            worker/notifications/presenter.ts \
            worker/profile/api.ts \
            worker/profile/service.ts \
            worker/profile/store.ts \
            worker/search/service.ts \
            worker/store/community-api.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/components/admin/AdminUserControlDialog.tsx \
            app/components/admin/store/AdminCosmeticCatalog.tsx \
            app/components/admin/store/AdminPackStoreCatalog.tsx \
            app/components/layout/TopBar.tsx \
            app/components/product/AuthScreen.tsx \
            app/components/product/cosmetic-visual.ts \
            app/components/product/CosmeticIdentity.tsx \
            app/components/product/custom-cosmetics.css \
            app/components/product/ProfileEditor.tsx \
            app/routes.ts \
            app/routes/_index.tsx \
            app/routes/admin-store.tsx \
            app/routes/admin-users.tsx \
            app/routes/admin-verifications.tsx \
            app/routes/search.tsx \
            shared/profile/social-links.ts \
            shared/store/custom-cosmetics.ts \
            shared/ui/contracts.ts \
            tests/unit/settings-redesign.test.ts \
            worker/admin/user-control.ts \
            worker/comments/api.ts \
            worker/notifications/presenter.ts \
            worker/profile/api.ts \
            worker/profile/service.ts \
            worker/profile/store.ts \
            worker/search/service.ts \
            worker/store/community-api.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format product overhaul sources"
            git push origin HEAD:feature/sourceboard-product-overhaul
          fi
