name: Temporary format snapshot

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app shared worker tests/unit/settings-redesign.test.ts
      - uses: actions/upload-artifact@v6
        with:
          name: formatted-sourceboard
          path: |
            app
            shared
            worker
            tests/unit/settings-redesign.test.ts
          retention-days: 1
