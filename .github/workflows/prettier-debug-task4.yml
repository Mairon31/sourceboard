name: Prettier debug task 4

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Show exact Prettier diff
        run: |
          npx prettier app/routes/post-detail.tsx tests/unit/comments-social-actions.test.ts worker/comments/store.ts --write
          git diff -- app/routes/post-detail.tsx tests/unit/comments-social-actions.test.ts worker/comments/store.ts
