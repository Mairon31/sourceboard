name: Temporary Public SEO GREEN

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  public-seo-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/sourceboard-product-overhaul
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire public SEO resources into the Worker and metadata policy
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("worker/app.ts")
          app = app_path.read_text()
          import_anchor = 'import { observeBackgroundFailure, observeRequest } from "./observability";\n'
          import_line = 'import { handlePublicSeoRequest } from "./seo/public";\n'
          if import_line not in app:
              if import_anchor not in app:
                  raise SystemExit("worker/app.ts import anchor missing")
              app = app.replace(import_anchor, import_anchor + import_line, 1)
          call_anchor = '    const apiResponse = await handleApiRequest(request, requestId, env);\n\n'
          call_block = '''    const seoResponse = await handlePublicSeoRequest(request, env);
    if (seoResponse) return finish(seoResponse);

    const apiResponse = await handleApiRequest(request, requestId, env);

'''
          if 'await handlePublicSeoRequest(request, env)' not in app:
              if call_anchor not in app:
                  raise SystemExit("worker/app.ts API anchor missing")
              app = app.replace(call_anchor, call_block, 1)
          app_path.write_text(app)

          route_path = Path("app/routes/post-detail.tsx")
          route = route_path.read_text()
          old = '''    loaderData.unavailable ||
    post.visibility !== "PUBLIC" ||
    post.nsfwPresentation === "HIDDEN"
'''
          new = '''    loaderData.unavailable ||
    post.isNsfw ||
    post.visibility !== "PUBLIC" ||
    post.nsfwPresentation === "HIDDEN"
'''
          if old in route:
              route = route.replace(old, new, 1)
          elif '    post.isNsfw ||\n' not in route:
              raise SystemExit("post-detail metadata condition did not match")
          route_path.write_text(route)
          PY
      - run: npx prettier --write worker/seo/public.ts worker/app.ts app/routes/post-detail.tsx tests/unit/public-seo-resources.test.ts
      - run: npx prettier --check worker/seo/public.ts worker/app.ts app/routes/post-detail.tsx tests/unit/public-seo-resources.test.ts
      - run: npm test -- --run tests/unit/public-seo-resources.test.ts
      - run: npm run typecheck
      - run: npm run build
      - name: Commit public SEO implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/seo/public.ts worker/app.ts app/routes/post-detail.tsx tests/unit/public-seo-resources.test.ts
          git commit -m "feat: publish privacy-safe SEO resources"
          git push origin HEAD:feature/sourceboard-product-overhaul
