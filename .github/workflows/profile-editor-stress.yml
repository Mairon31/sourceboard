name: Profile editor stress

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery
    paths:
      - .github/workflows/profile-editor-stress.yml

permissions:
  contents: read

jobs:
  verify-profile-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/profile-comments-categories-discovery
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrations:apply
      - name: Warm server and repeat strict profile-editor flow
        run: |
          npm run dev -- --host localhost --port 5173 > /tmp/sourceboard-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:5173/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/sourceboard-dev.log
            exit 1
          fi
          CI= npx playwright test tests/e2e/profile-editor.spec.ts --repeat-each=10 --retries=0 --timeout=60000
