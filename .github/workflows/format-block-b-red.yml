name: Format Block B RED fixture test

on:
  push:
    branches:
      - feature/platform-overhaul-block-b

permissions:
  contents: write

jobs:
  format-red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/platform-overhaul-block-b
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Format fixture test and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          npx prettier tests/unit/session-context-migration.test.ts --write
          rm .github/workflows/format-block-b-red.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/unit/session-context-migration.test.ts .github/workflows/format-block-b-red.yml
          git commit -m 'style: format Block B legacy migration fixture'
          git push origin HEAD:feature/platform-overhaul-block-b
