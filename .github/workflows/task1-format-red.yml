name: Task 1 canonical emote GREEN

on:
  push:
    branches:
      - feature/community-cosmetics-profile-identity-emotes

permissions:
  contents: write

jobs:
  canonical-emote:
    if: "${{ github.event.head_commit.message != 'feat(comments): preserve canonical emotes' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/community-cosmetics-profile-identity-emotes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply canonical emote implementation
        run: python .github/scripts/apply-task1-canonical-emotes.py
      - name: Format changed files
        run: npx prettier --write shared/richtext/markdown.ts worker/comments/richtext.ts worker/comments/service.ts worker/store/entitlements.ts tests/unit/comment-richtext.test.ts tests/unit/media-picker.test.ts
      - name: Run focused comment/emote tests
        run: npm test -- tests/unit/comment-richtext.test.ts tests/unit/markdown-richtext.test.ts tests/unit/media-picker.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Verify diff
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/richtext/markdown.ts worker/comments/richtext.ts worker/comments/service.ts worker/store/entitlements.ts tests/unit/comment-richtext.test.ts tests/unit/media-picker.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(comments): preserve canonical emotes"
          git push origin HEAD:feature/community-cosmetics-profile-identity-emotes
