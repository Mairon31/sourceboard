name: Task 1 canonical emote TDD

on:
  push:
    branches:
      - feature/community-cosmetics-profile-identity-emotes

jobs:
  canonical-emote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/community-cosmetics-profile-identity-emotes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check tests/unit/comment-richtext.test.ts
      - run: npm test -- tests/unit/comment-richtext.test.ts
