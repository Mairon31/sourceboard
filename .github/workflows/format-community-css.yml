name: Format community CSS parser

on:
  push:
    branches:
      - feature/community-cosmetics-profile-identity-emotes
    paths:
      - .github/workflows/format-community-css.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/community-cosmetics-profile-identity-emotes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - run: npx prettier --write shared/store/community-css.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/store/community-css.ts
          if git diff --cached --quiet; then
            echo "No formatter changes"
          else
            git commit -m "chore(store): format bounded CSS filters"
            git push origin HEAD:feature/community-cosmetics-profile-identity-emotes
          fi
