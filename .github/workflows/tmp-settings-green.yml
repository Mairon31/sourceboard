name: Temporary Settings GREEN

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  settings-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/sourceboard-product-overhaul
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/routes/settings.tsx
      - run: npx prettier --check app/routes/settings.tsx app/data/settings-preferences.ts app/components/product/settings-redesign.css app/root.tsx tests/unit/settings-redesign.test.ts
      - run: npm test -- --run tests/unit/settings-redesign.test.ts
      - name: Commit formatted Settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/settings.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format settings redesign"
            git push origin HEAD:feature/sourceboard-product-overhaul
          fi
