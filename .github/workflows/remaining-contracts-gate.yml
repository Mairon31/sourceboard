name: Remaining contracts gate

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/sourceboard-product-overhaul
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format focused tests
        run: npx prettier --write tests/unit/admin-user-control.test.ts tests/unit/product-overhaul-remaining-contracts.test.ts
      - name: Focused unit tests
        run: npm test -- tests/unit/admin-user-control.test.ts tests/unit/product-overhaul-remaining-contracts.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/admin-user-control.test.ts tests/unit/product-overhaul-remaining-contracts.test.ts
          git commit -m "style(test): normalize remaining overhaul contracts"
          git push origin HEAD:feature/sourceboard-product-overhaul
