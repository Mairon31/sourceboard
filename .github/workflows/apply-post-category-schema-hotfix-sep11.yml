name: Apply post category schema-lag hotfix

on:
  push:
    branches:
      - hotfix/post-category-schema-lag-sep11

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/post-category-schema-lag-sep11
      - name: Patch post store compatibility
        run: python .github/scripts/apply-post-category-schema-hotfix-sep11.py
      - name: Format patched file
        run: npx prettier --write worker/posts/store.ts
      - name: Commit patch when needed
        run: |
          if git diff --quiet -- worker/posts/store.ts; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "Mairon"
          git config user.email "maironjoelkin430@gmail.com"
          git add worker/posts/store.ts
          git commit -m "fix(posts): tolerate missing category column"
          git push origin HEAD:hotfix/post-category-schema-lag-sep11
