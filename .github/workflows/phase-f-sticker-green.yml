name: Phase F sticker-only GREEN

on:
  push:
    branches:
      - feature/community-cosmetics-profile-identity-emotes

permissions:
  contents: write

jobs:
  sticker-only-green:
    if: "${{ github.event.head_commit.message != 'fix(admin): land sticker-only managers correctly' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/community-cosmetics-profile-identity-emotes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply minimal Sticker-only fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/routes/admin-store.tsx')
          text = path.read_text()
          old = '''  const [mode, setMode] = useState<AdminStoreMode>(
    access.storeManage ? "COSMETICS" : "EMOTE_PACKS",
  );'''
          new = '''  const [mode, setMode] = useState<AdminStoreMode>(
    access.storeManage ? "COSMETICS" : access.emoteManage ? "EMOTE_PACKS" : "STICKER_PACKS",
  );'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Admin Store initial-mode anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed route
        run: npx prettier --write app/routes/admin-store.tsx
      - name: Verify focused GREEN
        run: |
          npx eslint app/routes/admin-store.tsx tests/unit/community-plan-phase-e2.test.ts
          npx prettier --check app/routes/admin-store.tsx tests/unit/community-plan-phase-e2.test.ts
          npm test -- tests/unit/community-plan-phase-e2.test.ts
          npm run typecheck
          git diff --check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/admin-store.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(admin): land sticker-only managers correctly"
          git push origin HEAD:feature/community-cosmetics-profile-identity-emotes
