name: Fix comment submit guard

on:
  push:
    paths:
      - .github/workflows/fix-comment-submit-guard.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --progress=false
      - name: Restore synchronous submission guard
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/components/product/CommentThread.tsx';
          let s = fs.readFileSync(path, 'utf8');
          s = s.replace('import { useCallback, useEffect, useState } from "react";', 'import { useCallback, useEffect, useRef, useState } from "react";');
          s = s.replace('  const [items, setItems] = useState(comments);', '  const submitInFlightRef = useRef(false);\n  const [items, setItems] = useState(comments);');
          s = s.replace('    if (submitting || (!body.trim() && !attachment)) return;\n    setSubmitting(true);', '    if (submitInFlightRef.current || (!body.trim() && !attachment)) return;\n    submitInFlightRef.current = true;\n    setSubmitting(true);');
          s = s.replace('    } finally {\n      setSubmitting(false);\n    }\n  }', '    } finally {\n      submitInFlightRef.current = false;\n      setSubmitting(false);\n    }\n  }');
          if (!s.includes('const submitInFlightRef = useRef(false);') || !s.includes('submitInFlightRef.current = true;') || !s.includes('submitInFlightRef.current = false;')) throw new Error('submit guard patch incomplete');
          fs.writeFileSync(path, s);
          NODE
      - run: npx prettier --write app/components/product/CommentThread.tsx
      - run: npm test -- --run tests/unit/profile-account-klipy-picker.test.ts
      - name: Commit repair and remove helper
        run: |
          rm .github/workflows/fix-comment-submit-guard.yml
          git config user.name "sourceboard-repair"
          git config user.email "actions@users.noreply.github.com"
          git add app/components/product/CommentThread.tsx .github/workflows/fix-comment-submit-guard.yml
          git commit -m "fix: prevent duplicate comment submissions"
          git push origin master
