name: Profile theme red

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery

permissions:
  contents: read

jobs:
  focused-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrations:apply
      - run: npx playwright test tests/e2e/profile-editor.spec.ts --grep "profile theme decorates"
