name: Store discovery TDD

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  store-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply implementation
        if: "${{ github.event.head_commit.message == 'chore(store): apply complete catalog behavior' }}"
        run: python .github/scripts/apply-store-complete-catalog.py
      - name: Format changed files
        if: "${{ github.event.head_commit.message == 'chore(store): apply complete catalog behavior' }}"
        run: npx prettier --write app/routes/store.tsx tests/unit/store-catalog-redesign.test.ts
      - name: Lint changed files
        if: "${{ github.event.head_commit.message == 'chore(store): apply complete catalog behavior' }}"
        run: npx eslint app/routes/store.tsx tests/unit/store-catalog-redesign.test.ts
      - name: Typecheck
        if: "${{ github.event.head_commit.message == 'chore(store): apply complete catalog behavior' }}"
        run: npm run typecheck
      - name: Run Store tests
        run: npm test -- tests/unit/store-catalog-redesign.test.ts tests/unit/store-refresh.test.ts
      - name: Commit implementation
        if: "${{ github.event.head_commit.message == 'chore(store): apply complete catalog behavior' && success() }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/store.tsx tests/unit/store-catalog-redesign.test.ts
          git commit -m "fix(store): keep full catalog visible"
          git push origin HEAD:feature/sourceboard-product-overhaul
