name: Profile accepted sources TDD

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  profile-accepted-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fix accepted-source test typing
        if: "${{ github.event.head_commit.message == 'chore(profile): apply accepted-source activity' }}"
        run: python .github/scripts/fix-profile-accepted-source-test-typing.py
      - name: Apply implementation
        if: "${{ github.event.head_commit.message == 'chore(profile): apply accepted-source activity' }}"
        run: python .github/scripts/apply-profile-accepted-sources.py
      - name: Format changed files
        if: "${{ github.event.head_commit.message == 'chore(profile): apply accepted-source activity' }}"
        run: npx prettier --write worker/posts/store.ts worker/posts/service.ts app/routes/profile.tsx app/components/product/ProfileActivity.tsx tests/unit/post-policy.test.ts
      - name: Lint changed files
        if: "${{ github.event.head_commit.message == 'chore(profile): apply accepted-source activity' }}"
        run: npx eslint worker/posts/store.ts worker/posts/service.ts app/routes/profile.tsx app/components/product/ProfileActivity.tsx tests/unit/post-policy.test.ts
      - name: Typecheck
        if: "${{ github.event.head_commit.message == 'chore(profile): apply accepted-source activity' }}"
        run: npm run typecheck
      - name: Run policy tests
        run: npm test -- tests/unit/post-policy.test.ts tests/unit/product-mobile-ux.test.ts
      - name: Commit implementation
        if: "${{ github.event.head_commit.message == 'chore(profile): apply accepted-source activity' && success() }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/posts/store.ts worker/posts/service.ts app/routes/profile.tsx app/components/product/ProfileActivity.tsx tests/unit/post-policy.test.ts
          git commit -m "fix(profile): show accepted contributions accurately"
          git push origin HEAD:feature/sourceboard-product-overhaul
