name: Format Block B Task 5 RED

on:
  push:
    branches:
      - feature/platform-overhaul-block-b

permissions:
  contents: write

jobs:
  format-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/platform-overhaul-block-b
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Format Task 5 RED and remove helper
        run: |
          npx prettier --write worker/auth/session-presenter.ts tests/unit/session-presenter.test.ts
          npm run lint
          rm .github/workflows/format-block-b-task5-red.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/auth/session-presenter.ts tests/unit/session-presenter.test.ts .github/workflows/format-block-b-task5-red.yml
          git commit -m "style: format Block B Task 5 RED"
          git push origin HEAD:feature/platform-overhaul-block-b
