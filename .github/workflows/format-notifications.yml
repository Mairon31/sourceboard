name: Format notification slice

on:
  push:
    paths:
      - .github/workflows/format-notifications.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --progress=false
      - run: npx prettier --write worker/notifications/api.ts worker/notifications/presenter.ts worker/notifications/service.ts app/routes/notifications.tsx app/data/notifications-realtime.ts app/components/layout/TopBar.tsx app/components/product/notifications.css app/root.tsx tests/unit/notification-presenter.test.ts tests/unit/notifications-realtime.test.ts
      - name: Commit formatting
        run: |
          git config user.name "sourceboard-builder"
          git config user.email "actions@users.noreply.github.com"
          git add worker/notifications app/routes/notifications.tsx app/data/notifications-realtime.ts app/components/layout/TopBar.tsx app/components/product/notifications.css app/root.tsx tests/unit/notification-presenter.test.ts tests/unit/notifications-realtime.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format notification activity slice"
          git push origin master
