name: Community plan Phase E1 GREEN

on:
  push:
    branches:
      - feature/community-cosmetics-profile-identity-emotes

permissions:
  contents: write

jobs:
  phase-e1-green:
    if: "${{ github.event.head_commit.message != 'feat(account): enforce username limits and focused audit' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/community-cosmetics-profile-identity-emotes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Phase E1 integration
        run: python .github/scripts/apply-phase-e1-green.py
      - name: Format changed source
        run: npx prettier --write worker/profile/username-policy.ts worker/admin/audit-visibility.ts worker/admin/read.ts worker/profile/api-core.ts app/routes/settings.tsx tests/unit/community-plan-phase-e1.test.ts
      - name: Apply all local D1 migrations
        run: npm run db:migrations:apply
      - name: Run Phase E1 and regression tests
        run: npm test -- tests/unit/community-plan-phase-e1.test.ts tests/unit/profile-service.test.ts tests/unit/auth-service.test.ts tests/unit/admin-control-center.test.ts tests/unit/community-plan-phase-d.test.ts tests/unit/community-plan-phase-c.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Verify diff
        run: git diff --check
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/profile/api-core.ts app/routes/settings.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(account): enforce username limits and focused audit"
          git push origin HEAD:feature/community-cosmetics-profile-identity-emotes
