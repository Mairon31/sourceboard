name: Finalize media picker slice

on:
  push:
    paths:
      - .github/workflows/finalize-media-picker.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --progress=false
      - name: Execute corrected implementation steps
        run: |
          python -m pip install --quiet pyyaml
          python <<'PY'
          from pathlib import Path
          import subprocess, yaml

          path = Path('.github/workflows/implement-media-picker.yml')
          text = path.read_text()
          old = "expect(picker).toContain('aria-label=\"Emotes\"');"
          new = "expect(picker).toContain('\"Emotes\"');"
          if old not in text:
              raise SystemExit('Expected literal assertion not found')
          text = text.replace(old, new)
          data = yaml.safe_load(text)
          steps = data['jobs']['implement']['steps']
          wanted = {
              'Write focused RED test',
              'Implement picker and entitled emote API',
              'Format and run focused GREEN gates',
          }
          for step in steps:
              if step.get('name') not in wanted:
                  continue
              print(f"\n--- {step['name']} ---", flush=True)
              subprocess.run(step['run'], shell=True, executable='/bin/bash', check=True)
          PY
      - name: Commit only verified product changes
        run: |
          git restore .github/workflows/implement-media-picker.yml
          git config user.name "sourceboard-builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/components/product/MediaPicker.tsx app/components/product/CommentThread.tsx app/components/product/RichText.tsx app/components/product/profile-klipy.css shared/richtext/markdown.ts shared/ui/contracts.ts worker/comments/api.ts worker/comments/store.ts worker/comments/service.ts worker/store/entitlements.ts tests/unit/media-picker.test.ts tests/unit/profile-account-klipy-picker.test.ts
          git commit -m "feat: add responsive klipy and emote picker"
          git push origin master
