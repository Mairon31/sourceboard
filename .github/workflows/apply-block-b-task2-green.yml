name: Apply Block B Task 2 GREEN

on:
  push:
    branches:
      - feature/platform-overhaul-block-b

permissions:
  contents: write

jobs:
  apply-task-2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/platform-overhaul-block-b
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Apply minimal public profile policy fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new))

          replace_exact(
              "worker/profile/types.ts",
              'export type ProfileVisibility = "PUBLIC" | "FRIENDS_ONLY";',
              'export type ProfileVisibility = "PUBLIC" | "FRIENDS_ONLY" | "PRIVATE";',
          )

          replace_exact(
              "worker/profile/store-core.ts",
              '  const visibility = row.profile_visibility === "FRIENDS_ONLY" ? "FRIENDS_ONLY" : "PUBLIC";',
              '''  const visibility =\n    row.profile_visibility === "FRIENDS_ONLY" || row.profile_visibility === "PRIVATE"\n      ? row.profile_visibility\n      : "PUBLIC";''',
          )
          replace_exact(
              "worker/profile/store-core.ts",
              "           WHERE u.username_normalized = ? AND u.status NOT IN ('DELETED', 'BANNED')`,",
              "           WHERE u.username_normalized = ? AND u.status = 'ACTIVE'`,",
          )
          replace_exact(
              "worker/profile/store-core.ts",
              "          `SELECT ${PROFILE_COLUMNS} FROM users u JOIN user_profiles p ON p.user_id = u.id WHERE u.id = ?`,",
              "          `SELECT ${PROFILE_COLUMNS} FROM users u JOIN user_profiles p ON p.user_id = u.id WHERE u.id = ? AND u.status = 'ACTIVE'`,",
          )

          replace_exact(
              "worker/privacy/policy.ts",
              '''  if (profile.profileVisibility === "PUBLIC") return true;\n  return (await dependencies.store.getRelationship(viewerId, targetId)) === "FRIEND";''',
              '''  if (profile.profileVisibility === "PUBLIC") return true;\n  if (profile.profileVisibility === "PRIVATE") return false;\n  return (await dependencies.store.getRelationship(viewerId, targetId)) === "FRIEND";''',
          )
          PY
          npx prettier --write worker/profile/types.ts worker/profile/store-core.ts worker/privacy/policy.ts
      - name: Verify Task 2 focused GREEN
        run: |
          npm run typecheck
          npm test -- --run tests/unit/public-profile-access.test.ts tests/unit/profile-policy.test.ts
      - name: Remove helper workflow and commit Task 2 GREEN
        run: |
          rm .github/workflows/apply-block-b-task2-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/profile/types.ts worker/profile/store-core.ts worker/privacy/policy.ts .github/workflows/apply-block-b-task2-green.yml
          git commit -m "feat: enforce public profile visibility policy"
          git push origin HEAD:feature/platform-overhaul-block-b
