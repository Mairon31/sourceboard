name: E4 prettier cleanup

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/profile-comments-categories-discovery
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - name: Format E4 stylesheet and remove workflow
        run: |
          npx prettier --write app/components/product/profile-effects.css
          rm .github/workflows/e4-prettier-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/product/profile-effects.css .github/workflows/e4-prettier-once.yml
          git commit -m "chore: format E4 profile effects"
          git push origin HEAD:feature/profile-comments-categories-discovery
