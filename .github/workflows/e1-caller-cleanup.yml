name: E1 caller cleanup

on:
  push:
    branches:
      - feature/profile-comments-categories-discovery
    paths:
      - .github/workflows/e1-caller-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/profile-comments-categories-discovery
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Remove profile effects from compact identities
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              "app/components/admin/AdminUserControlDialog.tsx",
              "app/components/product/CommentThread.tsx",
              "app/components/product/FriendsWorkspace.tsx",
              "app/components/product/NotificationActorStack.tsx",
              "app/components/product/PostCard.tsx",
              "app/components/product/PostComposer.tsx",
              "app/components/product/SearchPostGrid.tsx",
              "app/components/product/SourceResolution.tsx",
              "app/routes/admin-users.tsx",
              "app/routes/search.tsx",
          ]

          for filename in files:
              path = Path(filename)
              text = path.read_text()
              text = re.sub(r'^\s*profileEffect=\{[^\n]+\}\n', '', text, flags=re.MULTILINE)
              if filename.endswith("PostComposer.tsx"):
                  text = text.replace(
                      '"avatarFrame" | "profileEffect" | "nameFont" | "nameEffect"',
                      '"avatarFrame" | "nameFont" | "nameEffect"',
                  )
              path.write_text(text)

          forbidden = []
          for filename in files:
              text = Path(filename).read_text()
              if "profileEffect={" in text:
                  forbidden.append(filename)
          if forbidden:
              raise SystemExit(f"profileEffect prop remains in compact identity callers: {forbidden}")
          PY
      - name: Remove temporary workflow and commit cleanup
        run: |
          rm .github/workflows/e1-caller-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: keep profile effects card-scoped"
          git push origin HEAD:feature/profile-comments-categories-discovery
