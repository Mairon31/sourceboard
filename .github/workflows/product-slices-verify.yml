name: Product slices verification

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  product-slices:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format focused regressions
        run: npx prettier --write tests/unit/iconography-motion.test.ts tests/unit/firebase-verification-sync.test.ts
      - name: Verify cosmetics
        run: npm test -- tests/unit/global-cosmetic-visuals.test.ts tests/unit/cosmetic-identity-navigation.test.ts tests/unit/store-effects.test.ts
      - name: Verify reputation and contributions
        run: npm test -- tests/unit/reputation-rules.test.ts tests/unit/reputation-service.test.ts tests/unit/reputation-admin.test.ts tests/unit/reputation-admin-wiring.test.ts
      - name: Verify public resources
        run: npm test -- tests/unit/public-seo-resources.test.ts
      - name: Verify settings, iconography and motion
        run: npm test -- tests/unit/settings-redesign.test.ts tests/unit/profile-account-klipy-picker.test.ts tests/unit/iconography-motion.test.ts
      - name: Verify search
        run: npm test -- tests/unit/search-index.test.ts tests/unit/search-service.test.ts
      - name: Verify Firebase synchronization
        run: npm test -- tests/unit/firebase-auth.test.ts tests/unit/google-auth-hosting.test.ts tests/unit/firebase-verification-sync.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit formatting
        if: success()
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/iconography-motion.test.ts tests/unit/firebase-verification-sync.test.ts
          git commit -m "style: format focused product regressions"
          git push origin HEAD:feature/sourceboard-product-overhaul
