name: Format Artifact

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/format-artifact.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed implementation files
        run: npx prettier --write worker/catalog/api.ts worker/store/admin.ts worker/store/api.ts tests/unit/navigation-performance.test.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "SourceBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add worker/catalog/api.ts worker/store/admin.ts worker/store/api.ts tests/unit/navigation-performance.test.ts
          git commit -m "style: apply canonical prettier formatting"
          git push origin HEAD:master
