name: Format Artifact

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/format-artifact.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify navigation performance patches exist
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const auth = fs.readFileSync("worker/auth/service.ts", "utf8");
          const detail = fs.readFileSync("app/routes/post-detail.tsx", "utf8");
          if (!auth.includes("SESSION_TOUCH_INTERVAL_MS") || !auth.includes("at - current.lastUsedAt >= SESSION_TOUCH_INTERVAL_MS")) {
            throw new Error("session activity throttling is missing");
          }
          if (!detail.includes("const [post, commentsResult] = await Promise.all") || !detail.includes("commentService.listForPost")) {
            throw new Error("post detail concurrency optimization is missing");
          }
          NODE
      - name: Format Store and navigation implementation
        run: >-
          npx prettier --write
          worker/auth/service.ts
          shared/router-context.ts
          app/data/server-request.ts
          app/data/admin-access.ts
          app/data/capability-access.ts
          app/root.tsx
          worker/catalog/api.ts
          worker/store/admin.ts
          worker/store/api.ts
          app/routes/store.tsx
          app/routes/admin-store.tsx
          app/routes/post-detail.tsx
          app/components/product/ProductNav.tsx
          app/components/product/StoreItemCard.tsx
          app/components/product/StoreSection.tsx
          app/components/product/store-page.css
          app/components/admin/store/types.ts
          app/components/admin/store/AdminStoreEditor.tsx
          app/components/admin/store/AdminCosmeticCatalog.tsx
          app/components/admin/store/AdminEmotePackManager.tsx
          app/components/admin/store/admin-store.css
          tests/unit/navigation-performance.test.ts
          tests/unit/store-catalog-redesign.test.ts
          tests/unit/store-refresh.test.ts
          tests/e2e/test-helpers.ts
          tests/e2e/admin.spec.ts
          tests/e2e/responsive.spec.ts
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Run focused tests
        run: npm test -- --run tests/unit/navigation-performance.test.ts tests/unit/store-catalog-redesign.test.ts tests/unit/store-refresh.test.ts
      - name: Verify fresh Store migrations are idempotent
        run: |
          rm -rf .wrangler/verify-store-fresh
          npx wrangler d1 migrations apply DB --local --persist-to .wrangler/verify-store-fresh
          npx wrangler d1 migrations apply DB --local --persist-to .wrangler/verify-store-fresh
      - name: Commit normalization if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "SourceBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize final store and navigation changes"
          git push origin HEAD:master
