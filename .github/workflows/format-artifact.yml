name: Format Artifact

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/format-artifact.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply session activity throttling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("worker/auth/service.ts")
          text = path.read_text()

          marker = "export function createAuthService(dependencies: AuthServiceDependencies): AuthService {"
          if "const SESSION_TOUCH_INTERVAL_MS" not in text:
              if marker not in text:
                  raise SystemExit("createAuthService marker missing")
              text = text.replace(marker, "const SESSION_TOUCH_INTERVAL_MS = 5 * 60 * 1000;\n\n" + marker, 1)

          old_current_lookup = '''    const current = await dependencies.store.findActiveSessionByTokenHash(
              hashOpaqueToken(rawToken),
              now(),
            );'''
          new_current_lookup = '''    const at = now();
            const current = await dependencies.store.findActiveSessionByTokenHash(
              hashOpaqueToken(rawToken),
              at,
            );'''
          if old_current_lookup in text:
              text = text.replace(old_current_lookup, new_current_lookup, 1)

          current_start = text.index("  async function currentSession(")
          current_end = text.index("  async function prepareLogin(", current_start)
          current_block = text[current_start:current_end]
          if "const at = now();" not in current_block:
              raise SystemExit("currentSession timestamp patch missing")
          old_current_touch = "    await dependencies.store.touchSession(current.id, now());"
          if old_current_touch in current_block:
              current_block = current_block.replace(
                  old_current_touch,
                  "    if (at - current.lastUsedAt >= SESSION_TOUCH_INTERVAL_MS) {\n      await dependencies.store.touchSession(current.id, at);\n    }",
                  1,
              )
              text = text[:current_start] + current_block + text[current_end:]

          get_start = text.index("  async function getSession(")
          get_end = text.index("  async function logout(", get_start)
          get_block = text[get_start:get_end]
          old_get_touch = "    await dependencies.store.touchSession(current.id, at);"
          if old_get_touch in get_block and "SESSION_TOUCH_INTERVAL_MS" not in get_block:
              get_block = get_block.replace(
                  old_get_touch,
                  "    if (at - current.lastUsedAt >= SESSION_TOUCH_INTERVAL_MS) {\n      await dependencies.store.touchSession(current.id, at);\n    }",
                  1,
              )
              text = text[:get_start] + get_block + text[get_end:]

          if text.count("at - current.lastUsedAt >= SESSION_TOUCH_INTERVAL_MS") < 2:
              raise SystemExit("both session read paths were not throttled")
          path.write_text(text)
          PY
      - name: Verify navigation performance patches exist
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const auth = fs.readFileSync("worker/auth/service.ts", "utf8");
          const detail = fs.readFileSync("app/routes/post-detail.tsx", "utf8");
          if (!auth.includes("SESSION_TOUCH_INTERVAL_MS") || (auth.match(/lastUsedAt >= SESSION_TOUCH_INTERVAL_MS/g) || []).length < 2) {
            throw new Error("session activity throttling is missing");
          }
          if (!detail.includes("const [post, commentsResult] = await Promise.all") || !detail.includes("commentService.listForPost")) {
            throw new Error("post detail concurrency optimization is missing");
          }
          NODE
      - name: Format Store and navigation implementation
        run: >-
          npx prettier --write
          worker/auth/service.ts
          shared/router-context.ts
          app/data/server-request.ts
          app/data/admin-access.ts
          app/data/capability-access.ts
          app/root.tsx
          worker/catalog/api.ts
          worker/store/admin.ts
          worker/store/api.ts
          app/routes/store.tsx
          app/routes/admin-store.tsx
          app/routes/post-detail.tsx
          app/components/product/ProductNav.tsx
          app/components/product/StoreItemCard.tsx
          app/components/product/StoreSection.tsx
          app/components/product/store-page.css
          app/components/admin/store/types.ts
          app/components/admin/store/AdminStoreEditor.tsx
          app/components/admin/store/AdminCosmeticCatalog.tsx
          app/components/admin/store/AdminEmotePackManager.tsx
          app/components/admin/store/admin-store.css
          tests/unit/navigation-performance.test.ts
          tests/unit/store-catalog-redesign.test.ts
          tests/unit/store-refresh.test.ts
          tests/e2e/test-helpers.ts
          tests/e2e/navigation.spec.ts
          tests/e2e/admin.spec.ts
          tests/e2e/responsive.spec.ts
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Run focused tests
        run: npm test -- --run tests/unit/navigation-performance.test.ts tests/unit/store-catalog-redesign.test.ts tests/unit/store-refresh.test.ts
      - name: Verify fresh Store migrations are idempotent
        run: |
          rm -rf .wrangler/verify-store-fresh
          npx wrangler d1 migrations apply DB --local --persist-to .wrangler/verify-store-fresh
          npx wrangler d1 migrations apply DB --local --persist-to .wrangler/verify-store-fresh
      - name: Commit normalization if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "SourceBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "perf: persist session throttling and normalize final changes"
          git push origin HEAD:master
