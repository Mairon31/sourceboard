name: Format Artifact

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/format-artifact.yml"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed implementation files
        run: npx prettier --write worker/catalog/api.ts worker/store/admin.ts worker/store/api.ts tests/unit/navigation-performance.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-sourceboard
          path: |
            worker/catalog/api.ts
            worker/store/admin.ts
            worker/store/api.ts
            tests/unit/navigation-performance.test.ts
