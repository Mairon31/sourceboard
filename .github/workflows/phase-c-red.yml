name: Community plan Phase C GREEN

on:
  push:
    branches:
      - feature/community-cosmetics-profile-identity-emotes

permissions:
  contents: write

jobs:
  phase-c-green:
    if: "${{ github.event.head_commit.message != 'feat(profile): add themes and unified identity card' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/community-cosmetics-profile-identity-emotes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Phase C implementation
        run: python .github/scripts/apply-phase-c-green.py
      - name: Format changed files
        run: npx prettier --write shared/store/cosmetics.ts worker/profile/types.ts worker/profile/store-core.ts app/components/product/CosmeticIdentity.tsx app/components/product/ProfileIdentityCard.tsx app/components/product/profile-identity-card.css app/components/product/ProfileHero.tsx app/components/product/ProfileEditor.tsx app/routes/store.tsx app/components/product/StoreItemCard.tsx app/routes/admin-store.tsx tests/unit/community-plan-phase-c.test.ts
      - name: Run Phase C and regression tests
        run: npm test -- tests/unit/community-plan-phase-c.test.ts tests/unit/cosmetic-identity-navigation.test.ts tests/unit/profile-service.test.ts tests/unit/profile-account-klipy-picker.test.ts tests/unit/global-cosmetic-visuals.test.ts tests/unit/store-effects.test.ts tests/unit/store-catalog-redesign.test.ts tests/unit/store-service.test.ts tests/unit/community-plan-phase-a.test.ts tests/unit/community-plan-phase-b.test.ts tests/unit/product-mobile-ux.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Verify diff
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/store/cosmetics.ts worker/profile/types.ts worker/profile/store-core.ts app/components/product/CosmeticIdentity.tsx app/components/product/ProfileIdentityCard.tsx app/components/product/profile-identity-card.css app/components/product/ProfileHero.tsx app/components/product/ProfileEditor.tsx app/routes/store.tsx app/components/product/StoreItemCard.tsx app/routes/admin-store.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(profile): add themes and unified identity card"
          git push origin HEAD:feature/community-cosmetics-profile-identity-emotes
