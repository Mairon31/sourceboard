name: Stale mutation TDD

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  stale-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply stale mutation fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, marker: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected source block not found in {path}: {marker}")
              file.write_text(text.replace(old, new, 1))

          post = "app/components/product/PostCard.tsx"
          replace_once(
              post,
              '  const [reactionStatus, setReactionStatus] = useState<string | null>(null);\n  const [editing, setEditing] = useState(false);',
              '  const [reactionStatus, setReactionStatus] = useState<string | null>(null);\n  const [reactionBusy, setReactionBusy] = useState(false);\n  const [editing, setEditing] = useState(false);',
              'const [reactionBusy, setReactionBusy]',
          )
          replace_once(
              post,
              '  const mediaRef = useRef<HTMLImageElement>(null);\n  const detailHref = postDetailHref(post);',
              '''  const mediaRef = useRef<HTMLImageElement>(null);\n  const editingRef = useRef(editing);\n  const reactionInFlightRef = useRef(false);\n  const reactionVersionRef = useRef(0);\n  const authoritativeReactionRef = useRef({\n    liked: post.reaction.viewerReacted,\n    count: post.reaction.count,\n  });\n  editingRef.current = editing;\n  const detailHref = postDetailHref(post);''',
              'reactionInFlightRef = useRef',
          )
          replace_once(
              post,
              '''  useEffect(() => {\n    setCommentsClosedState(Boolean(post.commentsClosed));\n  }, [post.commentsClosed]);\n\n  useEffect(() => {\n    const image = mediaRef.current;''',
              '''  useEffect(() => {\n    setCommentsClosedState(Boolean(post.commentsClosed));\n  }, [post.commentsClosed]);\n\n  useEffect(() => {\n    setDisplayTitle(post.title);\n    setDisplayDescription(post.description ?? "");\n    if (!editingRef.current) {\n      setEditTitle(post.title);\n      setEditDescription(post.description ?? "");\n    }\n  }, [post.description, post.title]);\n\n  useEffect(() => {\n    authoritativeReactionRef.current = {\n      liked: post.reaction.viewerReacted,\n      count: post.reaction.count,\n    };\n    reactionVersionRef.current += 1;\n    if (!reactionInFlightRef.current) {\n      setLiked(post.reaction.viewerReacted);\n      setLikes(post.reaction.count);\n    }\n  }, [post.reaction.count, post.reaction.viewerReacted]);\n\n  useEffect(() => {\n    const image = mediaRef.current;''',
              'setDisplayTitle(post.title)',
          )
          replace_once(
              post,
              '''  async function toggleLike() {\n    setReactionStatus(null);\n    const previousLiked = liked;\n    const previousLikes = likes;\n    const nextLiked = !previousLiked;\n    setLiked(nextLiked);\n    setLikes(Math.max(0, previousLikes + (nextLiked ? 1 : -1)));\n\n    try {\n      const response = await fetch(`/api/reactions/POST/${encodeURIComponent(post.id)}`, {\n        method: previousLiked ? "DELETE" : "POST",\n        headers: { "x-csrf-token": readCsrfToken() },\n      });\n      if (!response.ok) {\n        setLiked(previousLiked);\n        setLikes(previousLikes);\n        setReactionStatus(response.status === 401 ? "Sign in to like posts." : "Like unavailable.");\n        return;\n      }\n      const result = (await response.json()) as { liked: boolean };\n      if (result.liked !== nextLiked) {\n        setLiked(result.liked);\n        setLikes(Math.max(0, previousLikes + (result.liked ? 1 : 0) - (previousLiked ? 1 : 0)));\n      }\n    } catch {\n      setLiked(previousLiked);\n      setLikes(previousLikes);\n      setReactionStatus("Like unavailable.");\n    }\n  }''',
              '''  async function toggleLike() {\n    if (reactionInFlightRef.current) return;\n    reactionInFlightRef.current = true;\n    setReactionBusy(true);\n    setReactionStatus(null);\n    const versionAtStart = reactionVersionRef.current;\n    const previousLiked = liked;\n    const previousLikes = likes;\n    const nextLiked = !previousLiked;\n    setLiked(nextLiked);\n    setLikes(Math.max(0, previousLikes + (nextLiked ? 1 : -1)));\n\n    try {\n      const response = await fetch(`/api/reactions/POST/${encodeURIComponent(post.id)}`, {\n        method: previousLiked ? "DELETE" : "POST",\n        headers: { "x-csrf-token": readCsrfToken() },\n      });\n      if (!response.ok) {\n        setLiked(previousLiked);\n        setLikes(previousLikes);\n        setReactionStatus(response.status === 401 ? "Sign in to like posts." : "Like unavailable.");\n        return;\n      }\n      const result = (await response.json()) as { liked: boolean };\n      if (result.liked !== nextLiked) {\n        setLiked(result.liked);\n        setLikes(Math.max(0, previousLikes + (result.liked ? 1 : 0) - (previousLiked ? 1 : 0)));\n      }\n    } catch {\n      setLiked(previousLiked);\n      setLikes(previousLikes);\n      setReactionStatus("Like unavailable.");\n    } finally {\n      reactionInFlightRef.current = false;\n      setReactionBusy(false);\n      if (reactionVersionRef.current !== versionAtStart) {\n        setLiked(authoritativeReactionRef.current.liked);\n        setLikes(authoritativeReactionRef.current.count);\n      }\n    }\n  }''',
              'const versionAtStart = reactionVersionRef.current',
          )
          replace_once(
              post,
              '            aria-label={liked ? "Unlike post" : "Like post"}\n            onClick={() => void toggleLike()}',
              '            aria-label={liked ? "Unlike post" : "Like post"}\n            disabled={reactionBusy}\n            onClick={() => void toggleLike()}',
              'disabled={reactionBusy}',
          )

          comments = "app/components/product/CommentThread.tsx"
          replace_once(
              comments,
              '  const [liked, setLiked] = useState(comment.reaction.viewerReacted);\n  const [likes, setLikes] = useState(comment.reaction.count);\n  const [editing, setEditing] = useState(false);',
              '''  const [liked, setLiked] = useState(comment.reaction.viewerReacted);\n  const [likes, setLikes] = useState(comment.reaction.count);\n  const [likeBusy, setLikeBusy] = useState(false);\n  const likeInFlightRef = useRef(false);\n  const likeReactionVersionRef = useRef(0);\n  const authoritativeLikeRef = useRef({\n    liked: comment.reaction.viewerReacted,\n    count: comment.reaction.count,\n  });\n  const [editing, setEditing] = useState(false);''',
              'likeInFlightRef = useRef',
          )
          replace_once(
              comments,
              '''  useEffect(() => {\n    setLiked(comment.reaction.viewerReacted);\n    setLikes(comment.reaction.count);\n    if (!editing) setEditBody(comment.body);\n  }, [comment.body, comment.reaction.count, comment.reaction.viewerReacted, editing]);''',
              '''  useEffect(() => {\n    authoritativeLikeRef.current = {\n      liked: comment.reaction.viewerReacted,\n      count: comment.reaction.count,\n    };\n    likeReactionVersionRef.current += 1;\n    if (!likeInFlightRef.current) {\n      setLiked(comment.reaction.viewerReacted);\n      setLikes(comment.reaction.count);\n    }\n  }, [comment.reaction.count, comment.reaction.viewerReacted]);\n\n  useEffect(() => {\n    if (!editing) setEditBody(comment.body);\n  }, [comment.body, editing]);''',
              'likeReactionVersionRef.current += 1',
          )
          replace_once(
              comments,
              '''  async function toggleLike() {\n    const nextLiked = !liked;\n    setLiked(nextLiked);\n    setLikes((value) => Math.max(0, value + (nextLiked ? 1 : -1)));\n    try {\n      const response = await fetch(`/api/reactions/COMMENT/${encodeURIComponent(comment.id)}`, {\n        method: nextLiked ? "POST" : "DELETE",\n        headers: { "x-csrf-token": readCsrfToken() },\n      });\n      if (!response.ok) throw new Error();\n      const result = (await response.json()) as { liked: boolean };\n      setLiked(result.liked);\n    } catch {\n      setLiked(!nextLiked);\n      setLikes((value) => Math.max(0, value + (nextLiked ? -1 : 1)));\n      setStatus("Like unavailable.");\n    }\n  }''',
              '''  async function toggleLike() {\n    if (likeInFlightRef.current) return;\n    likeInFlightRef.current = true;\n    setLikeBusy(true);\n    const versionAtStart = likeReactionVersionRef.current;\n    const previousLiked = liked;\n    const previousLikes = likes;\n    const nextLiked = !previousLiked;\n    setLiked(nextLiked);\n    setLikes(Math.max(0, previousLikes + (nextLiked ? 1 : -1)));\n    try {\n      const response = await fetch(`/api/reactions/COMMENT/${encodeURIComponent(comment.id)}`, {\n        method: nextLiked ? "POST" : "DELETE",\n        headers: { "x-csrf-token": readCsrfToken() },\n      });\n      if (!response.ok) throw new Error();\n      const result = (await response.json()) as { liked: boolean };\n      if (result.liked !== nextLiked) {\n        setLiked(result.liked);\n        setLikes(Math.max(0, previousLikes + (result.liked ? 1 : 0) - (previousLiked ? 1 : 0)));\n      }\n    } catch {\n      setLiked(previousLiked);\n      setLikes(previousLikes);\n      setStatus("Like unavailable.");\n    } finally {\n      likeInFlightRef.current = false;\n      setLikeBusy(false);\n      if (likeReactionVersionRef.current !== versionAtStart) {\n        setLiked(authoritativeLikeRef.current.liked);\n        setLikes(authoritativeLikeRef.current.count);\n      }\n    }\n  }''',
              'const versionAtStart = likeReactionVersionRef.current',
          )
          replace_once(
              comments,
              '            aria-pressed={liked}\n            onClick={() => void toggleLike()}',
              '            aria-pressed={liked}\n            disabled={likeBusy}\n            onClick={() => void toggleLike()}',
              'disabled={likeBusy}',
          )
          PY
      - name: Format focused files
        run: npx prettier --write app/components/product/PostCard.tsx app/components/product/CommentThread.tsx tests/unit/stale-mutation-ui.test.ts
      - name: Stale mutation contract
        run: npm test -- tests/unit/stale-mutation-ui.test.ts tests/unit/comments-social-actions.test.ts tests/unit/post-card-home-ux.test.ts tests/unit/product-mobile-ux.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint focused files
        run: npx eslint app/components/product/PostCard.tsx app/components/product/CommentThread.tsx tests/unit/stale-mutation-ui.test.ts
      - name: Check focused formatting
        run: npx prettier --check app/components/product/PostCard.tsx app/components/product/CommentThread.tsx tests/unit/stale-mutation-ui.test.ts
      - name: Commit product fix
        if: success()
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/product/PostCard.tsx app/components/product/CommentThread.tsx tests/unit/stale-mutation-ui.test.ts
          git commit -m "fix: reconcile stale mutation state"
          git push origin HEAD:feature/sourceboard-product-overhaul
