name: Format Cosmetic Guide

on:
  push:
    branches:
      - feature/community-cosmetics-profile-identity-emotes
    paths:
      - .github/workflows/format-cosmetic-guide.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/community-cosmetics-profile-identity-emotes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --strict-allow-scripts
      - run: npx prettier --write app/components/admin/store/AdminCosmeticGuide.tsx
      - run: npx prettier --check app/components/admin/store/AdminCosmeticGuide.tsx
      - name: Commit formatter output and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-cosmetic-guide.yml
          git add app/components/admin/store/AdminCosmeticGuide.tsx
          git commit -m "chore(store): format cosmetic guide"
          git push origin HEAD:feature/community-cosmetics-profile-identity-emotes
