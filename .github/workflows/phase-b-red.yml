name: Community plan Phase B RED

on:
  push:
    branches:
      - feature/community-cosmetics-profile-identity-emotes

permissions:
  contents: write

jobs:
  phase-b-red:
    if: "${{ github.event.head_commit.message != 'chore(stickers): format Phase B RED' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/community-cosmetics-profile-identity-emotes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/unit/community-plan-phase-b.test.ts
      - name: Persist formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/community-plan-phase-b.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "chore(stickers): format Phase B RED"
            git push origin HEAD:feature/community-cosmetics-profile-identity-emotes
          fi
      - run: npm test -- tests/unit/community-plan-phase-b.test.ts
