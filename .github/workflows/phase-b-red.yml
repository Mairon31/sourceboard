name: Community plan Phase B GREEN

on:
  push:
    branches:
      - feature/community-cosmetics-profile-identity-emotes

permissions:
  contents: write

jobs:
  phase-b-green:
    if: "${{ github.event.head_commit.message != 'feat(stickers): add first-party sticker packs' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/community-cosmetics-profile-identity-emotes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Phase B implementation
        run: python .github/scripts/apply-phase-b-green.py
      - name: Format changed files
        run: npx prettier --write worker/db/schema.ts worker/store/entitlements.ts worker/comments/api.ts app/components/product/MediaPicker.tsx worker/catalog/api.ts app/components/admin/store/AdminStickerPackManager.tsx app/routes/admin-store.tsx worker/store/service.ts tests/unit/community-plan-phase-b.test.ts
      - name: Apply all local D1 migrations
        run: npm run db:migrations:apply
      - name: Run focused sticker and regression tests
        run: npm test -- tests/unit/community-plan-phase-b.test.ts tests/unit/community-plan-phase-a.test.ts tests/unit/store-entitlement-modes.test.ts tests/unit/store-service.test.ts tests/unit/media-picker.test.ts tests/unit/catalog-admin-lifecycle.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Verify diff
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migrations/0024_sticker_pack_catalog.sql worker/db/schema.ts worker/store/entitlements.ts worker/comments/api.ts app/components/product/MediaPicker.tsx worker/catalog/api.ts app/components/admin/store/AdminStickerPackManager.tsx app/routes/admin-store.tsx worker/store/service.ts tests/unit/community-plan-phase-b.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(stickers): add first-party sticker packs"
          git push origin HEAD:feature/community-cosmetics-profile-identity-emotes
