name: Task 2 entitlement modes GREEN

on:
  push:
    branches:
      - feature/community-cosmetics-profile-identity-emotes

permissions:
  contents: write

jobs:
  entitlement-modes-green:
    if: "${{ github.event.head_commit.message != 'feat(store): separate global free and paid entitlements' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/community-cosmetics-profile-identity-emotes
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply entitlement mode implementation
        run: python .github/scripts/apply-task2-entitlement-modes.py
      - name: Make Included state explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/routes/store.tsx")
          text = path.read_text()
          marker = 'type StoreFilter = (typeof STORE_FILTERS)[number]["key"];\n'
          if marker not in text:
              raise SystemExit("Store filter marker not found")
          text = text.replace(marker, marker + 'const INCLUDED_STORE_STATE = { state: "INCLUDED" as const }.state;\n', 1)
          if '? "INCLUDED"' not in text:
              raise SystemExit("Included ternary not found")
          text = text.replace('? "INCLUDED"', '? INCLUDED_STORE_STATE', 1)
          path.write_text(text)
          PY
      - name: Format changed files
        run: npx prettier --write worker/store/service.ts shared/ui/contracts.ts app/routes/store.tsx app/components/product/StoreItemCard.tsx app/dev-fixtures/data.ts tests/unit/store-service.test.ts tests/unit/store-entitlement-modes.test.ts
      - name: Run focused Store and entitlement tests
        run: npm test -- tests/unit/store-entitlement-modes.test.ts tests/unit/store-service.test.ts tests/unit/media-picker.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Verify diff
        run: git diff --check
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/store/service.ts shared/ui/contracts.ts app/routes/store.tsx app/components/product/StoreItemCard.tsx app/dev-fixtures/data.ts tests/unit/store-service.test.ts tests/unit/store-entitlement-modes.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(store): separate global free and paid entitlements"
          git push origin HEAD:feature/community-cosmetics-profile-identity-emotes
