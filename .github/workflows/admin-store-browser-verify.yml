name: Admin Store browser verification

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: read

jobs:
  admin-store-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply local D1 migrations
        run: npm run db:migrations:apply
      - name: Run Store responsive browser checks
        run: npx playwright test tests/e2e/responsive.spec.ts --project=chromium --grep "/admin/store has no horizontal overflow|authorized Admin Store collapses|public Store cards and filters remain contained"
