name: Final E2E stabilization

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/sourceboard-product-overhaul
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply stabilization patch
        run: python .github/scripts/apply-final-e2e-stabilization.py
      - name: Format changed sources
        run: npx prettier --write app/routes/_index.tsx tests/unit/product-overhaul-remaining-contracts.test.ts tests/e2e/account-surfaces.spec.ts tests/e2e/core-product.spec.ts tests/e2e/navigation.spec.ts tests/e2e/seo.spec.ts
      - name: Feed contract unit test
        run: npm test -- tests/unit/product-overhaul-remaining-contracts.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply local D1 migrations
        run: npm run db:migrations:apply
      - name: Focused E2E regressions
        run: npx playwright test tests/e2e/account-surfaces.spec.ts tests/e2e/core-product.spec.ts tests/e2e/design-system.spec.ts tests/e2e/navigation.spec.ts tests/e2e/seo.spec.ts
      - name: Diff sanity
        run: git diff --check
      - name: Commit verified stabilization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/_index.tsx tests/unit/product-overhaul-remaining-contracts.test.ts tests/e2e/account-surfaces.spec.ts tests/e2e/core-product.spec.ts tests/e2e/navigation.spec.ts tests/e2e/seo.spec.ts
          git commit -m "fix(product): stabilize final browser regressions"
          git push origin HEAD:feature/sourceboard-product-overhaul
