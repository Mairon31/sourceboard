name: Store Schema RED

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/store-schema-red.yml"

jobs:
  red:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --run tests/unit/store-schema-compatibility.test.ts
