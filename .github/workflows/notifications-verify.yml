name: Notifications verification

on:
  push:
    branches:
      - feature/sourceboard-product-overhaul

permissions:
  contents: read

jobs:
  notifications:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run notification unit tests
        run: npm test -- tests/unit/notification-presenter.test.ts tests/unit/notification-service.test.ts tests/unit/notifications-realtime.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply local D1 migrations
        run: npm run db:migrations:apply
      - name: Run notification browser tests
        run: npx playwright test tests/e2e/notifications.spec.ts --project=chromium
