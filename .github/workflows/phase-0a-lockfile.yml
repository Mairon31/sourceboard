name: Phase 0A Bootstrap

on:
  push:
    branches: [phase-0a-design-system]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-0a-design-system
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install exact dependencies
        run: npm ci
      - name: Apply pinned Prettier
        run: npx prettier --write app shared tests
      - name: Commit formatter output when changed
        run: |
          if [ -n "$(git status --porcelain -- app shared tests)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app shared tests
            git commit -m "style: apply phase 0a formatter"
            git push origin HEAD:phase-0a-design-system
          fi
