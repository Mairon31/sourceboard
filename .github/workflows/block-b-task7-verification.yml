name: Block B Task 7 Verification

on:
  push:
    branches:
      - feature/platform-overhaul-block-b

permissions:
  contents: write

jobs:
  task7-verification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Block B focused gate
        run: >-
          npm test -- --run
          tests/unit/public-profile-defaults.test.ts
          tests/unit/session-context-migration.test.ts
          tests/unit/public-profile-access.test.ts
          tests/unit/profile-media-policy.test.ts
          tests/unit/auth-session-context.test.ts
          tests/unit/session-presenter.test.ts
          tests/unit/settings-security-layout.test.ts
      - name: Record verification evidence
        run: |
          python .github/scripts/block-b-task7-docs.py
          rm .github/scripts/block-b-task7-docs.py
          rm .github/workflows/block-b-task7-verification.yml
          npx prettier --write docs/IMPLEMENTATION_PROGRESS.md
          npx prettier --check docs/IMPLEMENTATION_PROGRESS.md
      - name: Commit verification docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: record Block B verification"
          git push origin HEAD:feature/platform-overhaul-block-b
