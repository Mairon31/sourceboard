name: Finalize Store

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/finalize-store.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Confirm current regressions are reproduced
        run: |
          if npm test -- --run tests/unit/navigation-performance.test.ts tests/unit/store-schema-compatibility.test.ts; then
            echo "Expected at least one current regression before applying the verified fixes."
            exit 1
          fi
          echo "Current regressions reproduced."
      - name: Apply verified Store and navigation fixes
        run: node scripts/finalize-store.mjs
      - name: Normalize changed implementation
        run: >-
          npx prettier --write
          scripts/finalize-store.mjs
          worker/auth/service.ts
          worker/store/service.ts
          worker/store/admin.ts
          worker/catalog/api.ts
          app/dev-fixtures/data.ts
          app/routes/post-detail.tsx
          app/routes/store.tsx
          app/routes/admin-store.tsx
          app/components/product/ProductNav.tsx
          app/components/product/StoreItemCard.tsx
          app/components/product/StoreSection.tsx
          app/components/product/store-page.css
          app/components/admin/store/types.ts
          app/components/admin/store/AdminStoreEditor.tsx
          app/components/admin/store/AdminCosmeticCatalog.tsx
          app/components/admin/store/AdminEmotePackManager.tsx
          app/components/admin/store/admin-store.css
          tests/unit/navigation-performance.test.ts
          tests/unit/store-schema-compatibility.test.ts
          tests/unit/store-catalog-redesign.test.ts
          tests/unit/store-refresh.test.ts
          tests/e2e/test-helpers.ts
          tests/e2e/navigation.spec.ts
          tests/e2e/admin.spec.ts
          tests/e2e/responsive.spec.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Focused tests
        run: npm test -- --run tests/unit/navigation-performance.test.ts tests/unit/store-schema-compatibility.test.ts tests/unit/store-catalog-redesign.test.ts tests/unit/store-refresh.test.ts
      - name: Verify fresh migrations are idempotent
        run: |
          rm -rf .wrangler/verify-store-fresh
          npx wrangler d1 migrations apply DB --local --persist-to .wrangler/verify-store-fresh
          npx wrangler d1 migrations apply DB --local --persist-to .wrangler/verify-store-fresh
      - name: Commit verified changes
        run: |
          git config user.name "SourceBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: restore Store across lifecycle schema rollout"
          git push origin HEAD:master
